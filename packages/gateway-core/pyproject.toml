[project]
name = "governed-llm-gateway-core"
version = "0.1.0"
description = "Domain and application core for Governed LLM Gateway"
requires-python = ">=3.13,<3.15"
dependencies = [
    "governed-llm-gateway-contracts",
    "PyYAML>=6.0.3,<7",
]

[tool.uv.sources]
governed-llm-gateway-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governed_llm_gateway_core"]
