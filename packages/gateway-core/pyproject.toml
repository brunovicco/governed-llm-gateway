[project]
name = "governed-llm-gateway-core"
version = "1.1.0"
description = "Domain and application core for Governed LLM Gateway"
license = "Apache-2.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "a2a-otel-kit==0.6.0",
    "cryptography>=50.0.0,<51",
    "governed-llm-gateway-contracts",
    "httpx>=0.28.1,<0.29",
    "jsonschema[format-nongpl]>=4.26.0,<5",
    "regex>=2026.9.10,<2027",
    "PyYAML>=6.0.3,<7",
]

[tool.uv.sources]
governed-llm-gateway-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governed_llm_gateway_core"]
