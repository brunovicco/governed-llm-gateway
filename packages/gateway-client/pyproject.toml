[project]
name = "governed-llm-gateway-client"
version = "0.2.0"
description = "Thin async client for Governed LLM Gateway"
requires-python = ">=3.13,<3.15"
dependencies = [
    "governed-llm-gateway-contracts",
    "httpx>=0.28.1,<0.29",
]

[tool.uv.sources]
governed-llm-gateway-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governed_llm_gateway_client"]
