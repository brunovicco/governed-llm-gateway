services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - 127.0.0.1:4318:4318
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      - tempo
    networks:
      - observability

  tempo:
    image: grafana/tempo:3.0.3
    command:
      - -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - observability

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
      - ./deploy/observability/grafana-dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/gateway.yaml:ro
      - ./deploy/observability/gateway-traces-dashboard.json:/etc/grafana/dashboards/gateway-traces.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:3000:3000
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/log/grafana:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      - tempo
    networks:
      - observability
      - grafana-host-access

networks:
  observability:
    internal: true
  grafana-host-access:
    driver: bridge

volumes:
  tempo-data:
  grafana-data:
