[project]
name = "governed-llm-gateway-api"
version = "0.1.0"
description = "FastAPI composition root for the Governed LLM Gateway"
license = "Apache-2.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "a2a-otel-kit==0.6.0",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.52.4",
    "governed-llm-gateway-contracts",
    "governed-llm-gateway-core",
]

[project.scripts]
governed-llm-gateway = "governed_llm_gateway_api.server:main"
governed-llm-gateway-operations-demo = "governed_llm_gateway_api.operations_demo:main"

[tool.uv.sources]
governed-llm-gateway-contracts = { workspace = true }
governed-llm-gateway-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governed_llm_gateway_api"]
