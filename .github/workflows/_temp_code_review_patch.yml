name: temp-code-review-patch

on:
  push:
    branches:
      - feat/code-review-benchmark-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact registry changes
        run: |
          python - <<'PY'
          from pathlib import Path

          contracts = Path("benchmarks/contracts.py")
          text = contracts.read_text(encoding="utf-8")
          old = '    CODE_GENERATION = "code_generation"\n    TOOL_USE = "tool_use"\n'
          new = '    CODE_GENERATION = "code_generation"\n    CODE_REVIEW = "code_review"\n    TOOL_USE = "tool_use"\n'
          assert old in text
          assert 'CODE_REVIEW = "code_review"' not in text
          contracts.write_text(text.replace(old, new, 1), encoding="utf-8")

          scoring = Path("benchmarks/scoring.py")
          text = scoring.read_text(encoding="utf-8")
          old_import = 'from .workloads.code_generation import CODE_GENERATION_SCORER_ID, score_code_generation\n'
          new_import = (
              'from .workloads.code_generation import CODE_GENERATION_SCORER_ID, score_code_generation\n'
              'from .workloads.code_review import CODE_REVIEW_SCORER_ID, score_code_review\n'
          )
          assert old_import in text
          assert 'CODE_REVIEW_SCORER_ID' not in text
          text = text.replace(old_import, new_import, 1)
          old_entry = '        CODE_GENERATION_SCORER_ID: score_code_generation,\n        TOOL_USE_SCORER_ID: score_tool_use,\n'
          new_entry = (
              '        CODE_GENERATION_SCORER_ID: score_code_generation,\n'
              '        CODE_REVIEW_SCORER_ID: score_code_review,\n'
              '        TOOL_USE_SCORER_ID: score_tool_use,\n'
          )
          assert old_entry in text
          scoring.write_text(text.replace(old_entry, new_entry, 1), encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/contracts.py benchmarks/scoring.py
          git commit -m "feat: register code review benchmark" || exit 0
          git push
