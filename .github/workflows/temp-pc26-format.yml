name: temp-pc26-format

on:
  push:
    branches:
      - feat/pc26-tempo-query-proof
    paths:
      - .github/workflows/temp-pc26-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Set up Python
        run: uv python install 3.13
      - name: Format reviewed contract and remove temporary workflow
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format tests/contract/test_tempo_query_foundation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contract/test_tempo_query_foundation.py
          git rm .github/workflows/temp-pc26-format.yml
          git commit -m "style: format Tempo query contract"
          git push origin HEAD:feat/pc26-tempo-query-proof
