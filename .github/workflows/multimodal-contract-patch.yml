name: multimodal-contract-patch

on:
  push:
    branches:
      - feat/multimodal-input-contract-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed patch
        run: python .github/scripts/apply_multimodal_patch.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages apps
          git commit -m "feat: add bounded multimodal image input foundation"
          git push origin HEAD:feat/multimodal-input-contract-v1
