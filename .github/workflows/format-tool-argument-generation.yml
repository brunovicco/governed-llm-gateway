name: format-tool-argument-generation

on:
  push:
    branches:
      - feat/tool-argument-generation-benchmark-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tool-argument-generation-benchmark-v1
      - uses: astral-sh/setup-uv@v6
      - name: Format reviewed workload
        run: uvx --python 3.13 --from ruff==0.12.11 ruff format benchmarks/workloads/tool_argument_generation.py
      - name: Commit formatter output
        run: |
          if git diff --quiet -- benchmarks/workloads/tool_argument_generation.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/workloads/tool_argument_generation.py
          git commit -m "style: format tool argument workload"
          git push origin HEAD:feat/tool-argument-generation-benchmark-v1
