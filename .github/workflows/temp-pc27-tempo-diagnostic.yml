name: temp-pc27-tempo-diagnostic

on:
  push:
    branches:
      - feat/pc27-grafana-tempo-dashboard
    paths:
      - .github/workflows/temp-pc27-tempo-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pinned Tempo image and both configs
        run: |
          set -euo pipefail
          docker pull grafana/tempo:3.0.3
          echo "IMAGE_ID=$(docker image inspect grafana/tempo:3.0.3 --format '{{.Id}}')"
          echo "REPO_DIGESTS=$(docker image inspect grafana/tempo:3.0.3 --format '{{json .RepoDigests}}')"
          echo "VERSION:"
          docker run --rm grafana/tempo:3.0.3 -version || true
          echo "HELP CONFIG FLAGS:"
          docker run --rm grafana/tempo:3.0.3 -help 2>&1 | grep -E 'config\.(file|verify)|backend-worker|compaction' | head -80 || true
          for config in deploy/observability/tempo.yaml tests/integration/tempo-query.yaml; do
            echo "=== $config ==="
            cid="$(docker run -d \
              --mount "type=bind,src=$PWD/$config,dst=/etc/tempo/tempo.yaml,readonly" \
              grafana/tempo:3.0.3 -config.file=/etc/tempo/tempo.yaml)"
            sleep 3
            running="$(docker inspect "$cid" --format '{{.State.Running}}')"
            exit_code="$(docker inspect "$cid" --format '{{.State.ExitCode}}')"
            docker logs "$cid" || true
            echo "RUNNING=$running EXIT_CODE=$exit_code"
            docker rm -f "$cid" >/dev/null 2>&1 || true
            if [ "$running" != true ] && [ "$exit_code" -ne 0 ]; then
              exit "$exit_code"
            fi
          done
