name: quality-components-format

on:
  push:
    branches:
      - feat/benchmark-quality-component-evidence
    paths:
      - .github/workflows/quality-components-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/benchmark-quality-component-evidence
      - uses: astral-sh/setup-uv@v6
      - name: Format reviewed files
        run: >-
          uvx --python 3.13 --from ruff==0.12.11 ruff format
          benchmarks/scoring.py
          tests/contract/test_benchmark_quality_component_evidence.py
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/scoring.py tests/contract/test_benchmark_quality_component_evidence.py
          git commit -m "style: format benchmark quality component evidence"
          git push origin HEAD:feat/benchmark-quality-component-evidence
