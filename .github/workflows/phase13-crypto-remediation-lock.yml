name: phase13-crypto-remediation-lock

on:
  push:
    branches:
      - feat/phase-13-governance-integration
    paths:
      - .github/workflows/phase13-crypto-remediation-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Refresh remediated dependency lock
        run: |
          uv python install 3.13
          uv lock
          uv lock --check
      - name: Commit lock and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase13-crypto-remediation-lock.yml
          git add uv.lock
          git commit -m "chore: lock remediated cryptography release"
          git push origin HEAD:feat/phase-13-governance-integration
