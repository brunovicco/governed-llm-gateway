name: pc25-lock

on:
  push:
    branches:
      - feat/pc25-gateway-console-foundation
    paths:
      - apps/gateway-console/package.json
      - .github/workflows/pc25-lock.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Generate deterministic npm lockfile
        working-directory: apps/gateway-console
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        run: |
          rm .github/workflows/pc25-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/gateway-console/package-lock.json .github/workflows/pc25-lock.yml
          git commit -m "build: lock Gateway Console dependencies"
          git push
