name: phase13-crypto-bootstrap

on:
  push:
    branches:
      - feat/phase-13-governance-integration
    paths:
      - .github/workflows/phase13-crypto-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Refresh lock and format crypto slice
        run: |
          uv python install 3.13
          uv lock
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/governance_authorization.py
          uvx --python 3.13 --from ruff==0.12.11 ruff check \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/governance_authorization.py
      - name: Commit generated changes and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase13-crypto-bootstrap.yml
          git add uv.lock packages/gateway-core/src/governed_llm_gateway_core/adapters/governance_authorization.py
          git commit -m "chore: finalize Phase 13 crypto bootstrap"
          git push origin HEAD:feat/phase-13-governance-integration
