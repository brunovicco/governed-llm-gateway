name: phase14-terminal-evidence-format

on:
  push:
    branches: [fix/sdk-terminal-execution-evidence]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/sdk-terminal-execution-evidence
      - name: Wrap client guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/gateway-client/src/governed_llm_gateway_client/client.py")
          text = path.read_text()
          old = '                raise GatewayProtocolError("completed gateway response is missing execution evidence")\n'
          new = '''                raise GatewayProtocolError(\n                    "completed gateway response is missing execution evidence"\n                )\n'''
          if old not in text:
              raise SystemExit("expected client guard not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/phase14-terminal-evidence-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/gateway-client/src/governed_llm_gateway_client/client.py .github/workflows/phase14-terminal-evidence-format.yml
          git commit -m "style: wrap terminal execution guard"
          git push origin HEAD:fix/sdk-terminal-execution-evidence
