name: phase11-explain-provenance-fix

on:
  push:
    paths:
      - .github/workflows/phase11-explain-provenance-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-11-evidence-driven-ranking
          fetch-depth: 0
      - name: Patch explain provenance
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path("apps/gateway-api/src/governed_llm_gateway_api/route_explain.py")
          text = route.read_text()
          old = (
              "    score_snapshot_id: str\n"
              "    selected_score: str | None\n"
          )
          new = (
              "    score_snapshot_id: str\n"
              "    benchmark_snapshot_id: str | None = None\n"
              "    score_provenance_mode: str | None = None\n"
              "    manual_override_id: str | None = None\n"
              "    selected_score: str | None\n"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected RankingExplainModel shape")
          text = text.replace(old, new)
          old = (
              "            score_snapshot_id=decision.score_snapshot_id,\n"
              "            selected_score=(\n"
          )
          new = (
              "            score_snapshot_id=decision.score_snapshot_id,\n"
              "            benchmark_snapshot_id=decision.routing.benchmark_snapshot_id,\n"
              "            score_provenance_mode=decision.routing.score_provenance_mode,\n"
              "            manual_override_id=decision.routing.manual_override_id,\n"
              "            selected_score=(\n"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected explain response mapping shape")
          route.write_text(text.replace(old, new))

          test = Path("tests/contract/test_route_explain_api.py")
          text = test.read_text()
          old = (
              "from governed_llm_gateway_core.domain.model_registry import (\n"
          )
          new = (
              "from governed_llm_gateway_core.domain.evidence_ranking import (\n"
              "    EvidenceDrivenRankingPolicy,\n"
              "    ScoreProvenanceMode,\n"
              ")\n"
              "from governed_llm_gateway_core.domain.model_registry import (\n"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected test import insertion point")
          text = text.replace(old, new)
          old = "def _client(resolver: FakeResolver | RejectingResolver) -> TestClient:\n"
          new = (
              "def _client(\n"
              "    resolver: FakeResolver | RejectingResolver,\n"
              "    ranking_policy: RankingPolicy | None = None,\n"
              ") -> TestClient:\n"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected _client signature")
          text = text.replace(old, new)
          old = "        ranking_policy=_ranking_policy(),\n"
          new = "        ranking_policy=ranking_policy or _ranking_policy(),\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected _client ranking policy assignment")
          text = text.replace(old, new)
          marker = "\ndef _payload() -> dict[str, object]:\n"
          helper = '''\n\ndef _evidence_ranking_policy() -> EvidenceDrivenRankingPolicy:\n    base = _ranking_policy()\n    return EvidenceDrivenRankingPolicy(\n        schema_version="1.1",\n        policy_version="ranking-benchmark-v1",\n        score_snapshot_id="benchmark-hybrid-v1",\n        source_date=TODAY,\n        workloads=base.workloads,\n        score_provenance_mode=ScoreProvenanceMode.MANUAL_OVERRIDE,\n        benchmark_snapshot_id="sha256:" + "c" * 64,\n        promotion_evidence_id="sha256:" + "d" * 64,\n        manual_override_id="sha256:" + "e" * 64,\n    )\n'''
          if text.count(marker) != 1:
              raise SystemExit("unexpected payload marker")
          text = text.replace(marker, helper + marker)
          old = (
              '    assert first.json()["ranking"]["decision_id"].startswith("sha256:")\n'
              '    assert "messages" not in first.json()\n'
          )
          new = (
              '    assert first.json()["ranking"]["decision_id"].startswith("sha256:")\n'
              '    assert first.json()["ranking"]["benchmark_snapshot_id"] is None\n'
              '    assert first.json()["ranking"]["score_provenance_mode"] is None\n'
              '    assert first.json()["ranking"]["manual_override_id"] is None\n'
              '    assert "messages" not in first.json()\n'
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected static explain assertions")
          text = text.replace(old, new)
          append = '''\n\ndef test_route_explain_exposes_phase11_reconstruction_provenance() -> None:\n    policy = _evidence_ranking_policy()\n    client = _client(FakeResolver(), policy)\n\n    response = client.post(\n        "/v1/route/explain",\n        json=_payload(),\n        headers={"X-Gateway-API-Key": TEST_CREDENTIAL},\n    )\n\n    assert response.status_code == 200\n    ranking = response.json()["ranking"]\n    assert ranking["benchmark_snapshot_id"] == policy.benchmark_snapshot_id\n    assert ranking["score_provenance_mode"] == "manual_override"\n    assert ranking["manual_override_id"] == policy.manual_override_id\n'''
          test.write_text(text + append)
          PY
      - uses: astral-sh/setup-uv@v6
      - name: Validate and format
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff check --fix apps/gateway-api/src/governed_llm_gateway_api/route_explain.py tests/contract/test_route_explain_api.py
          uvx --python 3.13 --from ruff==0.12.11 ruff format apps/gateway-api/src/governed_llm_gateway_api/route_explain.py tests/contract/test_route_explain_api.py
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/phase11-explain-provenance-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/gateway-api/src/governed_llm_gateway_api/route_explain.py tests/contract/test_route_explain_api.py .github/workflows/phase11-explain-provenance-fix.yml
          git commit -m "fix: expose Phase 11 provenance in route explain"
          git push origin HEAD:feat/phase-11-evidence-driven-ranking
