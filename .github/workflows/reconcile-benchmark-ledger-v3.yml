name: reconcile-benchmark-ledger-v3

on:
  push:
    branches:
      - docs/reconcile-benchmark-ledger-pr50-pr52

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-benchmark-ledger-pr50-pr52
      - name: Reconcile benchmark documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def ensure_replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text and old not in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"replacement marker mismatch: {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def ensure_regex(path: str, pattern: str, replacement: str, done_marker: str) -> None:
              p = Path(path)
              text = p.read_text()
              if done_marker in text:
                  return
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"regex marker mismatch: {path}: {pattern[:80]!r}")
              p.write_text(updated)

          for path, pr in (
              ("docs/evaluation/SECURITY_ANALYSIS_V1.md", 50),
              ("docs/evaluation/TOOL_SELECTION_V1.md", 51),
              ("docs/evaluation/TOOL_ARGUMENT_GENERATION_V1.md", 52),
          ):
              ensure_replace(
                  path,
                  "Status: IMPLEMENTED — pending branch/PR validation.",
                  f"Status: COMPLETE — merged in PR #{pr}.",
              )

          current_state = "docs/project/CURRENT_STATE.md"
          ensure_replace(
              current_state,
              "- PR #48 — `code-review-v1`, a non-executing structured-findings benchmark with six reviewed non-security rules, two clean cases and deterministic set-F1 scoring.\n",
              "- PR #48 — `code-review-v1`, a non-executing structured-findings benchmark with six reviewed non-security rules, two clean cases and deterministic set-F1 scoring.\n"
              "- PR #50 — `security-analysis-v1`, a defensive structured-findings benchmark over synthetic Python with six reviewed security rules, two clean cases, deterministic set-F1 scoring, and no candidate execution or exploitation path.\n"
              "- PR #51 — `tool-selection-v1`, an exact reviewed tool-or-no-tool benchmark over immutable `support-tools-v1`, with no argument generation or tool execution.\n"
              "- PR #52 — `tool-argument-generation-v1`, a fixed-reviewed-tool benchmark with recursive exact, type-sensitive argument scoring and no tool selection or execution.\n",
          )
          ensure_regex(
              current_state,
              r"Latest validated gateway baseline after PR #48:\n\n.*?- architecture check, secret scan and Phase 0 gate passed\.",
              "Latest validated gateway baseline after PR #52:\n\n"
              "`b12bda2a3ffdace9c8c75fe5d38e7a5e1fa673e7`\n\n"
              "Post-merge quality run:\n\n"
              "`34036693888` — PASS.\n\n"
              "Validation:\n\n"
              "- 645 tests passed;\n"
              "- aggregate coverage 81.96%;\n"
              "- strict mypy passed across 165 source files;\n"
              "- Ruff lint/format passed across 165 files;\n"
              "- Bandit reported no issues across 15,059 LOC;\n"
              "- pip-audit reported no known vulnerabilities;\n"
              "- architecture check, secret scan and Phase 0 gate passed.",
              "Latest validated gateway baseline after PR #52:",
          )

          matrix = "docs/evaluation/BENCHMARK_MATRIX.md"
          ensure_replace(
              matrix,
              "Status: **COMPLETE — 5/5 core roadmap workloads plus reviewed post-core multimodal, long-context, classification, reasoning and code-review extensions implemented**",
              "Status: **COMPLETE — 5/5 core roadmap workloads plus reviewed post-core multimodal, long-context, classification, reasoning, code-review, security-analysis, tool-selection and tool-argument-generation extensions implemented**",
          )
          ensure_replace(
              matrix,
              "The Phase 10 framework originally established a generic provider-neutral benchmark pipeline. PRs #19–#24 then added workload-specific deterministic contracts on top of that foundation without turning the benchmark layer into runtime authority. After core execution stabilized, PR #32 added the roadmap-authorized `multimodal_analysis` extension, PR #44 added `long_context`, PR #45 added `classification`, PR #47 added `reasoning`, and PR #48 added `code_review`.",
              "The Phase 10 framework originally established a generic provider-neutral benchmark pipeline. PRs #19–#24 then added workload-specific deterministic contracts on top of that foundation without turning the benchmark layer into runtime authority. After core execution stabilized, PR #32 added the roadmap-authorized `multimodal_analysis` extension, PR #44 added `long_context`, PR #45 added `classification`, PR #47 added `reasoning`, PR #48 added `code_review`, PR #50 added `security_analysis`, PR #51 added `tool_selection`, and PR #52 added `tool_argument_generation`.",
          )
          ensure_replace(
              matrix,
              "| `code_review` | `code-review-v1` | structured non-security findings with deterministic set-F1 scoring; candidate code is never executed | #48 |\n",
              "| `code_review` | `code-review-v1` | structured non-security findings with deterministic set-F1 scoring; candidate code is never executed | #48 |\n"
              "| `security_analysis` | `security-analysis-v1` | defensive structured security findings with deterministic set-F1 scoring; candidate code is never executed and exploitation is out of scope | #50 |\n"
              "| `tool_selection` | `tool-selection-v1` | exact reviewed tool-or-no-tool selection from immutable `support-tools-v1`; arguments and execution are out of scope | #51 |\n"
              "| `tool_argument_generation` | `tool-argument-generation-v1` | fixed reviewed tool plus recursive exact, type-sensitive argument matching; selection and execution are out of scope | #52 |\n",
          )
          ensure_replace(
              matrix,
              "## Post-core multimodal and evidence hardening\n",
              "### security_analysis\n\n`security-analysis-v1` evaluates defensive structured findings over checked-in synthetic Python. Its reviewed security vocabulary is separate from `code-review-v1`; exact finding validity and set-F1 scoring are deterministic, candidate code is never executed, and exploitation instructions are outside the contract.\n\n"
              "### tool_selection\n\n`tool-selection-v1` measures only exact reviewed tool choice or explicit no-tool choice from immutable `support-tools-v1`. Argument generation and tool execution are intentionally excluded so selection failures remain attributable.\n\n"
              "### tool_argument_generation\n\n`tool-argument-generation-v1` fixes the reviewed tool identity in the case and scores only the generated `arguments` object with recursive exact, type-sensitive comparison. Tool selection and execution remain separate boundaries; `selected_tool` is benchmark ground truth, not runtime authorization.\n\n"
              "## Post-core multimodal and evidence hardening\n",
          )
          ensure_replace(
              matrix,
              "PR #44 added `long-context-v1` without a provider tokenizer dependency or a fabricated token-count claim. PR #45 added `classification-v1` as an exact closed-set workload with immutable label vocabulary and strict dataset drift checks. PR #47 added `reasoning-v1` with answer-only, type-sensitive scoring and no chain-of-thought collection. PR #48 added `code-review-v1` with structured reviewed non-security findings, clean-case false-positive coverage and no candidate execution.\n\nThese are consumer-agnostic benchmark extensions. None adds a live executor, changes provider selection, or creates a benchmark-only authorization/routing path.",
              "PR #44 added `long-context-v1` without a provider tokenizer dependency or a fabricated token-count claim. PR #45 added `classification-v1` as an exact closed-set workload with immutable label vocabulary and strict dataset drift checks. PR #47 added `reasoning-v1` with answer-only, type-sensitive scoring and no chain-of-thought collection. PR #48 added `code-review-v1` with structured reviewed non-security findings, clean-case false-positive coverage and no candidate execution. PR #50 added `security-analysis-v1` with a separate defensive security vocabulary and no exploitation path. PR #51 added `tool-selection-v1` to isolate exact tool-choice quality. PR #52 added `tool-argument-generation-v1` to isolate argument quality after the reviewed tool identity is fixed.\n\nThese are consumer-agnostic benchmark extensions. None adds a live executor, changes provider selection, or creates a benchmark-only authorization/routing path.",
          )
          ensure_regex(
              matrix,
              r"Latest validated `main` baseline after PR #48:\n\n.*?- architecture check, secret scan and Phase 0 gate passed\.",
              "Latest validated `main` baseline after PR #52:\n\n"
              "- commit `b12bda2a3ffdace9c8c75fe5d38e7a5e1fa673e7`;\n"
              "- post-merge quality run `34036693888` — PASS;\n"
              "- 645 tests passed;\n"
              "- 81.96% aggregate coverage;\n"
              "- strict mypy and Ruff passed across 165 source files;\n"
              "- Bandit reported no issues across 15,059 LOC;\n"
              "- pip-audit reported no known vulnerabilities;\n"
              "- architecture check, secret scan and Phase 0 gate passed.",
              "Latest validated `main` baseline after PR #52:",
          )
          ensure_replace(
              matrix,
              "Completion of the core 5/5 matrix and the reviewed post-core multimodal, long-context, classification, reasoning, code-review and execution-evidence increments does **not** create a new Phase 14 consumer migration exception.",
              "Completion of the core 5/5 matrix and the reviewed post-core multimodal, long-context, classification, reasoning, code-review, security-analysis, tool-selection, tool-argument-generation and execution-evidence increments does **not** create a new Phase 14 consumer migration exception.",
          )
          PY
      - name: Commit reconciliation
        run: |
          if git diff --quiet -- docs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: reconcile benchmark ledger through PR 52"
          git push origin HEAD:docs/reconcile-benchmark-ledger-pr50-pr52
