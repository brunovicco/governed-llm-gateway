name: pc25-lock-refresh

on:
  push:
    branches:
      - feat/pc25-gateway-console-foundation
    paths:
      - .github/workflows/pc25-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pc25-gateway-console-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Refresh deterministic npm lockfile
        working-directory: apps/gateway-console
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pc25-lock-refresh.yml
          git add apps/gateway-console/package-lock.json
          git commit -m "build: align Gateway Console lock with Node 24 types"
          git push origin HEAD:feat/pc25-gateway-console-foundation
