name: fix-rag-ptbr-v2-doc-provenance

on:
  push:
    branches:
      - docs/reconcile-rag-ptbr-v2-pr67
    paths:
      - .github/workflows/fix-rag-ptbr-v2-doc-provenance.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-rag-ptbr-v2-pr67
      - name: Fix documentation provenance
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one marker in {path}, found {count}: {old!r}")
              target.write_text(text.replace(old, new))

          replace_once(
              "README.md",
              "Where current reviewed scorers genuinely support them, PR #64 preserves these offline quality components separately from the historical scalar score:",
              "Where current reviewed scorers genuinely support them, PR #64 established component-preserving offline quality evidence and PR #67 extended the reviewed vocabulary with bounded PT-BR quality:",
          )
          replace_once(
              "README.pt-BR.md",
              "Onde os scorers atuais realmente sustentam a medida, o PR #64 preserva estes componentes de qualidade offline separadamente do score escalar histórico:",
              "Onde os scorers atuais realmente sustentam a medida, o PR #64 estabeleceu evidência offline com componentes preservados e o PR #67 estendeu o vocabulário revisado com qualidade PT-BR limitada:",
          )
          replace_once(
              "docs/evaluation/BENCHMARK_QUALITY_COMPONENTS.md",
              "Status: **COMPLETE — merged in PR #64.**",
              "Status: **COMPLETE — component evidence framework merged in PR #64; bounded `pt_br_quality` vocabulary extended in PR #67.**",
          )
          PY
      - name: Commit provenance fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.pt-BR.md docs/evaluation/BENCHMARK_QUALITY_COMPONENTS.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: correct rag ptbr v2 evidence provenance"
          git push origin HEAD:docs/reconcile-rag-ptbr-v2-pr67
