name: format-operational-evidence

on:
  push:
    branches:
      - feat/versioned-operational-evidence
    paths:
      - .github/workflows/format-operational-evidence.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/versioned-operational-evidence
      - uses: astral-sh/setup-uv@v6
      - name: Apply deterministic lint fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/contract/test_operational_evidence.py")
          text = path.read_text()
          old = '        setattr(record, "provider_error_count", 0)\n'
          new = '        delattr(record, "provider_error_count")\n'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one frozen setattr marker")
          path.write_text(text.replace(old, new))
          PY
          uvx --python 3.13 --from ruff==0.12.11 ruff check --fix . || true
          uvx --python 3.13 --from ruff==0.12.11 ruff format .
          uvx --python 3.13 --from ruff==0.12.11 ruff check .
          git diff --check
      - name: Commit formatted increment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/gateway-core/src/governed_llm_gateway_core/domain/operational_evidence.py \
                  packages/gateway-core/src/governed_llm_gateway_core/adapters/operational_evidence_json.py \
                  tests/contract/test_operational_evidence.py
          git diff --cached --quiet && exit 0
          git commit -m "style: format operational evidence increment"
          git push origin HEAD:feat/versioned-operational-evidence
