name: phase14-terminal-evidence-type-fix

on:
  push:
    branches: [fix/sdk-terminal-execution-evidence]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/sdk-terminal-execution-evidence
      - name: Type SDK response helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/contract/test_phase14_terminal_execution_evidence.py")
          text = path.read_text()
          old = '    GatewayRequest,\n    GatewayStreamEvent,\n'
          new = '    GatewayRequest,\n    GatewayResponse,\n    GatewayStreamEvent,\n'
          if old not in text:
              raise SystemExit("gateway contract import anchor not found")
          text = text.replace(old, new, 1)
          old = '    async def generate() -> object:\n'
          new = '    async def generate() -> GatewayResponse:\n'
          if old not in text:
              raise SystemExit("generate helper return annotation not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/phase14-terminal-evidence-type-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/contract/test_phase14_terminal_execution_evidence.py .github/workflows/phase14-terminal-evidence-type-fix.yml
          git commit -m "test: type terminal evidence SDK response"
          git push origin HEAD:fix/sdk-terminal-execution-evidence
