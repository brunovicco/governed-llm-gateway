name: phase11-fix-override-typing

on:
  push:
    paths:
      - .github/workflows/phase11-fix-override-typing.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-11-evidence-driven-ranking
          fetch-depth: 0
      - name: Fix strict typing narrowings
        run: |
          python - <<'PY'
          from pathlib import Path

          override_test = Path("tests/contract/test_phase11_override_rollback.py")
          text = override_test.read_text()
          old_import = (
              "from governed_llm_gateway_core.domain.evidence_ranking import (\n"
              "    EvidenceDrivenRankingPolicy,\n"
              "    EvidenceRankingError,\n"
              "    ScoreProvenanceMode,\n"
              ")\n"
          )
          new_import = (
              "from governed_llm_gateway_core.domain.evidence_ranking import (\n"
              "    EvidenceDrivenRankingPolicy,\n"
              "    EvidenceRankingError,\n"
              "    ScoreProvenanceMode,\n"
              "    benchmark_snapshot_id,\n"
              "    manual_override_id,\n"
              ")\n"
          )
          if text.count(old_import) != 1:
              raise SystemExit("unexpected evidence_ranking test import shape")
          text = text.replace(old_import, new_import)
          old_asserts = (
              "    assert rolled_back.benchmark_snapshot_id == baseline.benchmark_snapshot_id\n"
              "    assert rolled_back.manual_override_id is None\n"
          )
          new_asserts = (
              "    assert benchmark_snapshot_id(rolled_back) == baseline.benchmark_snapshot_id\n"
              "    assert manual_override_id(rolled_back) is None\n"
          )
          if text.count(old_asserts) != 1:
              raise SystemExit("unexpected rollback assertion shape")
          override_test.write_text(text.replace(old_asserts, new_asserts))

          runtime_test = Path("tests/contract/test_phase11_runtime_provenance.py")
          text = runtime_test.read_text()
          old = (
              "    assert first.selected == second.selected\n"
              "    assert first.selected is not None\n"
              "    assert first.selected.score == second.selected.score\n"
          )
          new = (
              "    assert first.selected == second.selected\n"
              "    assert first.selected is not None\n"
              "    assert second.selected is not None\n"
              "    assert first.selected.score == second.selected.score\n"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected runtime selected narrowing shape")
          runtime_test.write_text(text.replace(old, new))
          PY
      - uses: astral-sh/setup-uv@v6
      - name: Validate formatting
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff check --fix packages/gateway-core/src/governed_llm_gateway_core/domain/ranking_override.py tests/contract/test_phase11_override_rollback.py tests/contract/test_phase11_runtime_provenance.py
          uvx --python 3.13 --from ruff==0.12.11 ruff format packages/gateway-core/src/governed_llm_gateway_core/domain/ranking_override.py tests/contract/test_phase11_override_rollback.py tests/contract/test_phase11_runtime_provenance.py
      - name: Commit fixes and remove workflow
        run: |
          rm .github/workflows/phase11-fix-override-typing.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/gateway-core/src/governed_llm_gateway_core/domain/ranking_override.py tests/contract/test_phase11_override_rollback.py tests/contract/test_phase11_runtime_provenance.py .github/workflows/phase11-fix-override-typing.yml
          git commit -m "fix: satisfy Phase 11 override strict typing"
          git push origin HEAD:feat/phase-11-evidence-driven-ranking
