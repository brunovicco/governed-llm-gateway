name: structured-v2-type-fix

on:
  push:
    branches:
      - feat/benchmark-structured-extraction-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Apply type-only edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("benchmarks/workloads/structured_extraction_v2.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          output = []
          in_compare = False
          compare_issue_declarations = 0
          for line in lines:
              if line.startswith("def _compare_values("):
                  in_compare = True
              elif in_compare and line.startswith("def _value_units("):
                  in_compare = False

              if line == "        if len(required) != len(set(required)):":
                  output.append(
                      "        required_fields = [item for item in required if isinstance(item, str)]"
                  )
                  output.append(
                      "        if len(required_fields) != len(set(required_fields)):"
                  )
                  continue
              if line == "        unknown_required = sorted(set(required) - set(properties))":
                  output.append(
                      "        unknown_required = sorted(set(required_fields) - set(properties))"
                  )
                  continue
              output.append(line)
              if line == '    raw_type = schema.get("type")':
                  output.append("    types: tuple[str, ...]")
              if in_compare and line == "        issues: list[StructuredExtractionIssue] = []":
                  compare_issue_declarations += 1
                  if compare_issue_declarations == 2:
                      output[-1] = "        issues = []"
          if compare_issue_declarations != 2:
              raise SystemExit("unexpected compare issue declaration count")
          path.write_text("\n".join(output) + "\n", encoding="utf-8")

          path = Path("tests/contract/test_structured_extraction_v2_benchmark.py")
          text = path.read_text(encoding="utf-8")
          old = "    failures = {\n"
          new = "    failures: dict[str, JsonValue | BenchmarkProviderFailure] = {\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected failures declaration count")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Format changed files
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            benchmarks/workloads/structured_extraction_v2.py \
            tests/contract/test_structured_extraction_v2_benchmark.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/workloads/structured_extraction_v2.py tests/contract/test_structured_extraction_v2_benchmark.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: satisfy structured extraction v2 typing"
          git push origin "HEAD:${GITHUB_REF_NAME}"
