name: rag-answer-format-preview

on:
  push:
    branches:
      - feat/rag-answer-benchmark-v1

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Print canonical Ruff formatting diff
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format --diff \
            benchmarks/workloads/rag_answer.py \
            tests/contract/test_rag_answer_benchmark.py
