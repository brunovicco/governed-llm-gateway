name: fix-tool-argument-format

on:
  push:
    branches:
      - feat/tool-argument-generation-benchmark-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tool-argument-generation-benchmark-v1
      - name: Fix reviewed line length
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("benchmarks/workloads/tool_argument_generation.py")
          text = path.read_text()
          old = '        raise ValueError("tool argument generation v1 expected output must contain exactly arguments")\n'
          new = (
              '        raise ValueError(\n'
              '            "tool argument generation v1 expected output must contain exactly arguments"\n'
              '        )\n'
          )
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/workloads/tool_argument_generation.py
          git commit -m "style: format tool argument validation"
          git push origin HEAD:feat/tool-argument-generation-benchmark-v1
