name: format-multimodal

on:
  push:
    branches:
      - feat/multimodal-input-contract-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            packages/gateway-client/src/governed_llm_gateway_client/client.py \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/openai_responses.py
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/gateway-client/src/governed_llm_gateway_client/client.py \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/openai_responses.py
          git commit -m "style: format multimodal changes"
          git push origin HEAD:feat/multimodal-input-contract-v1
