name: Harden Phase14 evidence decoder

on:
  push:
    branches: [feat/provider-neutral-planner-evidence]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-neutral-planner-evidence
      - uses: astral-sh/setup-uv@v6
      - name: Preserve invalid wire values for contract validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/gateway-client/src/governed_llm_gateway_client/_codec.py')
          text = p.read_text()
          old = '''def _decode_execution(payload: dict[str, object]) -> ProviderExecution:\n    _check_fields(payload, _EXECUTION_FIELDS, "provider execution")\n    usage_value = payload.get("usage")\n    return ProviderExecution(\n'''
          new = '''def _decode_execution(payload: dict[str, object]) -> ProviderExecution:\n    _check_fields(payload, _EXECUTION_FIELDS, "provider execution")\n    usage_value = payload.get("usage")\n    attempt_number = _optional_int(payload, "attempt_number")\n    fallback_index = _optional_int(payload, "fallback_index")\n    return ProviderExecution(\n'''
          if old not in text:
              raise SystemExit('decode execution prelude not found')
          text = text.replace(old, new)
          old = '''        attempt_number=_optional_int(payload, "attempt_number") or 1,\n        fallback_index=_optional_int(payload, "fallback_index") or 0,\n'''
          new = '''        attempt_number=1 if attempt_number is None else attempt_number,\n        fallback_index=0 if fallback_index is None else fallback_index,\n'''
          if old not in text:
              raise SystemExit('decode execution defaults not found')
          p.write_text(text.replace(old, new))

          t = Path('tests/contract/test_phase14_execution_provenance.py')
          test = t.read_text()
          test += '''\n\ndef test_sdk_decoder_does_not_hide_invalid_attempt_number() -> None:\n    from governed_llm_gateway_client._codec import _decode_execution\n\n    payload: dict[str, object] = {\n        "provider": "anthropic",\n        "model": "claude",\n        "deployment": "d",\n        "status": "succeeded",\n        "latency_ms": 1,\n        "attempt_number": 0,\n        "fallback_index": 0,\n    }\n    with pytest.raises(ValueError, match="attempt_number"):\n        _decode_execution(payload)\n'''
          t.write_text(test)
          PY
          uvx --from ruff==0.12.11 ruff format \
            packages/gateway-client/src/governed_llm_gateway_client/_codec.py \
            tests/contract/test_phase14_execution_provenance.py
      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages tests
          git commit -m "test: fail closed on invalid execution attempt provenance"
          git push
