name: phase11-wire-provenance

on:
  push:
    branches:
      - feat/phase-11-evidence-driven-ranking
    paths:
      - .github/workflows/phase11-wire-provenance.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-11-evidence-driven-ranking
      - name: Wire benchmark provenance into routing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/gateway-core/src/governed_llm_gateway_core/application/ranking.py")
          text = path.read_text()

          old = "from governed_llm_gateway_core.domain.model_registry import ModelDeployment, ModelRegistry\n"
          new = (
              "from governed_llm_gateway_core.domain.evidence_ranking import benchmark_snapshot_id\n"
              "from governed_llm_gateway_core.domain.model_registry import ModelDeployment, ModelRegistry\n"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected model_registry import occurrence count")
          text = text.replace(old, new, 1)

          old = "            score_snapshot_id=ranking_policy.score_snapshot_id,\n            provider="
          new = (
              "            score_snapshot_id=ranking_policy.score_snapshot_id,\n"
              "            benchmark_snapshot_id=benchmark_snapshot_id(ranking_policy),\n"
              "            provider="
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected RoutingProvenance insertion point")
          text = text.replace(old, new, 1)

          old = '        "score_snapshot_id": ranking_policy.score_snapshot_id,\n        "max_latency_ms":'
          new = (
              '        "score_snapshot_id": ranking_policy.score_snapshot_id,\n'
              '        "benchmark_snapshot_id": benchmark_snapshot_id(ranking_policy),\n'
              '        "max_latency_ms":'
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected decision-id insertion point")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - uses: astral-sh/setup-uv@v6
      - name: Validate scoped change
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff check \
            packages/gateway-core/src/governed_llm_gateway_core/application/ranking.py
          uvx --python 3.13 --from ruff==0.12.11 ruff format --check \
            packages/gateway-core/src/governed_llm_gateway_core/application/ranking.py
      - name: Commit wiring and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase11-wire-provenance.yml
          git add packages/gateway-core/src/governed_llm_gateway_core/application/ranking.py
          git commit -m "feat: expose benchmark snapshot in routing provenance"
          git push origin HEAD:feat/phase-11-evidence-driven-ranking
