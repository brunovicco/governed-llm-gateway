name: Sync Phase14 evidence regressions

on:
  push:
    branches: [feat/provider-neutral-planner-evidence]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-neutral-planner-evidence
      - uses: astral-sh/setup-uv@v6
      - name: Update evidence contract regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/contract/test_phase14_terminal_execution_evidence.py')
          text = p.read_text()
          old = '''        latency_ms=250,\n        usage=usage_event.usage,\n    )\n'''
          new = '''        latency_ms=250,\n        usage=usage_event.usage,\n        provider_request_id="provider-response",\n        finish_reason="stop",\n        attempt_number=1,\n        fallback_index=0,\n    )\n'''
          if old not in text:
              raise SystemExit('runtime execution expectation not found')
          text = text.replace(old, new, 1)

          old = '''        "latency_ms": 41,\n        "usage": {"input_tokens": 7, "output_tokens": 3},\n    }\n'''
          new = '''        "latency_ms": 41,\n        "attempt_number": 1,\n        "fallback_index": 0,\n        "usage": {"input_tokens": 7, "output_tokens": 3},\n    }\n'''
          if old not in text:
              raise SystemExit('api execution payload expectation not found')
          p.write_text(text.replace(old, new, 1))

          q = Path('tests/contract/test_phase14_execution_provenance.py')
          test = q.read_text()
          test += '''\n\ndef test_sdk_decoder_preserves_extended_execution_and_usage_evidence() -> None:\n    from governed_llm_gateway_client._codec import _decode_execution\n\n    payload: dict[str, object] = {\n        "provider": "bedrock",\n        "model": "model-id",\n        "deployment": "deployment-a",\n        "status": "succeeded",\n        "latency_ms": 37,\n        "provider_request_id": "aws-request-id",\n        "finish_reason": "end_turn",\n        "attempt_number": 2,\n        "fallback_index": 1,\n        "usage": {\n            "input_tokens": 11,\n            "output_tokens": 5,\n            "total_tokens": 16,\n            "cache_read_input_tokens": 3,\n            "cache_write_input_tokens": 1,\n            "total_cost_usd": "0.0017",\n        },\n    }\n    execution = _decode_execution(payload)\n    assert execution.provider_request_id == "aws-request-id"\n    assert execution.finish_reason == "end_turn"\n    assert execution.attempt_number == 2\n    assert execution.fallback_index == 1\n    assert execution.usage is not None\n    assert execution.usage.total_tokens == 16\n    assert execution.usage.cache_read_input_tokens == 3\n    assert execution.usage.cache_write_input_tokens == 1\n    assert execution.usage.total_cost_usd == Decimal("0.0017")\n'''
          q.write_text(test)
          PY
          uvx --from ruff==0.12.11 ruff format \
            tests/contract/test_phase14_terminal_execution_evidence.py \
            tests/contract/test_phase14_execution_provenance.py
      - name: Commit regression synchronization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests
          git commit -m "test: preserve extended terminal execution evidence"
          git push
