name: rag-ptbr-v2-integrate

on:
  push:
    branches:
      - feat/rag-ptbr-v2-quality
    paths:
      - .github/workflows/rag-ptbr-v2-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rag-ptbr-v2-quality
      - uses: astral-sh/setup-uv@v6
      - name: Integrate reviewed PT-BR v2 evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one marker in {path}: {old!r}")
              target.write_text(text.replace(old, new))

          replace_once(
              "benchmarks/contracts.py",
              '    GROUNDING = "grounding"\n',
              '    GROUNDING = "grounding"\n    PT_BR_QUALITY = "pt_br_quality"\n',
          )

          replace_once(
              "benchmarks/scoring.py",
              'from .workloads.rag_ptbr import RAG_PTBR_SCORER_ID, score_rag_ptbr\n',
              'from .workloads.rag_ptbr import RAG_PTBR_SCORER_ID, score_rag_ptbr\n'
              'from .workloads.rag_ptbr_v2 import (\n'
              '    RAG_PTBR_V2_SCORER_ID,\n'
              '    assess_rag_ptbr_v2,\n'
              ')\n',
          )

          old_measurement = '''def _rag_answer_measurement(case: BenchmarkCase, output: JsonValue) -> QualityMeasurement:\n    assessment = assess_rag_answer(case, output)\n    return QualityMeasurement(\n        score=assessment.score,\n        metrics={BenchmarkQualityMetric.GROUNDING: assessment.score},\n    )\n\n\n'''
          new_measurement = old_measurement + '''def _rag_ptbr_v2_measurement(case: BenchmarkCase, output: JsonValue) -> QualityMeasurement:\n    assessment = assess_rag_ptbr_v2(case, output)\n    return QualityMeasurement(\n        score=assessment.score,\n        metrics={\n            BenchmarkQualityMetric.GROUNDING: assessment.grounding_score,\n            BenchmarkQualityMetric.PT_BR_QUALITY: assessment.pt_br_quality_score,\n        },\n    )\n\n\n'''
          replace_once("benchmarks/scoring.py", old_measurement, new_measurement)

          replace_once(
              "benchmarks/scoring.py",
              '        RAG_PTBR_SCORER_ID: score_rag_ptbr,\n'
              '        RAG_ANSWER_SCORER_ID: ComponentScorer(_rag_answer_measurement),\n',
              '        RAG_PTBR_SCORER_ID: score_rag_ptbr,\n'
              '        RAG_PTBR_V2_SCORER_ID: ComponentScorer(_rag_ptbr_v2_measurement),\n'
              '        RAG_ANSWER_SCORER_ID: ComponentScorer(_rag_answer_measurement),\n',
          )
          PY

          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            benchmarks/contracts.py \
            benchmarks/scoring.py \
            benchmarks/workloads/rag_ptbr_v2.py \
            tests/contract/test_rag_ptbr_v2_benchmark.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            benchmarks/contracts.py \
            benchmarks/scoring.py \
            benchmarks/workloads/rag_ptbr_v2.py \
            tests/contract/test_rag_ptbr_v2_benchmark.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate rag ptbr v2 quality evidence"
          git push origin HEAD:feat/rag-ptbr-v2-quality
