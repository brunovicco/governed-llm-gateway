name: structured-v2-format-preview

on:
  push:
    branches:
      - feat/benchmark-structured-extraction-v2

permissions:
  contents: write

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Format changed Python files
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            benchmarks/workloads/structured_extraction_v2.py \
            tests/contract/test_structured_extraction_v2_benchmark.py
      - name: Commit formatter output
        run: |
          if git diff --quiet -- benchmarks/workloads/structured_extraction_v2.py tests/contract/test_structured_extraction_v2_benchmark.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/workloads/structured_extraction_v2.py tests/contract/test_structured_extraction_v2_benchmark.py
          git commit -m "style: format structured extraction v2"
          git push origin "HEAD:${GITHUB_REF_NAME}"
