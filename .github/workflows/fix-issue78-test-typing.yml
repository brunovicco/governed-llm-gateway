name: fix-issue78-test-typing

on:
  push:
    branches:
      - feat/operational-sample-batch-handoff

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operational-sample-batch-handoff
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Apply strict typing fix fail closed
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/contract/test_operational_sample_batch.py")
          text = path.read_text()
          edits = [
              (
                  "from governed_llm_gateway_core.application.operational_sample_batch import (\n    OperationalSampleBatchError,\n",
                  "from governed_llm_gateway_core.application.operational_sample_batch import (\n    OperationalSampleBatch,\n    OperationalSampleBatchError,\n",
              ),
              ("def _batch():\n", "def _batch() -> OperationalSampleBatch:\n"),
          ]
          for old, new in edits:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one typing marker, found {count}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          uvx --python 3.13 --from ruff==0.12.11 ruff check --fix tests/contract/test_operational_sample_batch.py
          uvx --python 3.13 --from ruff==0.12.11 ruff format tests/contract/test_operational_sample_batch.py
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-issue78-test-typing.yml
      - name: Commit typing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contract/test_operational_sample_batch.py .github/workflows/fix-issue78-test-typing.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "no typing changes"; exit 1; }
          git commit -m "test: type operational sample batch fixture"
          git push origin HEAD:feat/operational-sample-batch-handoff
