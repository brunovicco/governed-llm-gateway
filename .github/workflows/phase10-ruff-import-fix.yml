name: phase10-ruff-import-fix

on:
  push:
    branches:
      - feat/phase-10-evaluation-framework

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-10-evaluation-framework
      - uses: astral-sh/setup-uv@v6
      - name: Apply pinned Ruff fix
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff check --select I --fix benchmarks/contracts.py
          uvx --python 3.13 --from ruff==0.12.11 ruff format benchmarks/contracts.py
          rm .github/workflows/phase10-ruff-import-fix.yml
      - name: Commit maintenance result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/contracts.py .github/workflows/phase10-ruff-import-fix.yml
          git diff --cached --exit-code && exit 0
          git commit -m "style: apply pinned Ruff import ordering"
          git push origin HEAD:feat/phase-10-evaluation-framework
