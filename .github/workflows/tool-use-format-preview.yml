name: tool-use-format-preview

on:
  push:
    branches:
      - feat/benchmark-tool-use-v1

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Show Ruff format diff
        run: uvx --python 3.13 --from ruff==0.12.11 ruff format --diff benchmarks/workloads/tool_use.py
