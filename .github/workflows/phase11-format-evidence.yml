name: phase11-format-evidence

on:
  push:
    branches:
      - feat/phase-11-evidence-driven-ranking
    paths:
      - .github/workflows/phase11-format-evidence.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-11-evidence-driven-ranking
      - uses: astral-sh/setup-uv@v6
      - name: Format runtime evidence contract
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            packages/gateway-core/src/governed_llm_gateway_core/domain/ranking_evidence.py
          uvx --python 3.13 --from ruff==0.12.11 ruff check \
            packages/gateway-core/src/governed_llm_gateway_core/domain/ranking_evidence.py
      - name: Commit formatted file and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase11-format-evidence.yml
          git add packages/gateway-core/src/governed_llm_gateway_core/domain/ranking_evidence.py
          git commit -m "style: format Phase 11 runtime evidence contract"
          git push origin HEAD:feat/phase-11-evidence-driven-ranking
