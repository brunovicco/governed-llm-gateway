name: fix-multimodal-test-typing

on:
  push:
    branches:
      - feat/multimodal-input-contract-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type tests against provider ports
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/contract/test_multimodal_input_foundation.py")
          text = path.read_text()
          text = text.replace(
              "    ProviderFeatureSupport,\n    ProviderRequest,\n    ProviderStreamEvent,\n",
              "    ProviderFeatureSupport,\n    ProviderPort,\n    ProviderRequest,\n    ProviderStreamEvent,\n    ProviderStreamingPort,\n",
              1,
          )
          marker = '''def test_other_non_streaming_adapters_fail_closed_before_image_provider_io(\n    adapter_name: str,\n) -> None:\n    transport = FakeJsonTransport()\n'''
          replacement = marker + "    adapter: ProviderPort\n"
          if marker not in text:
              raise SystemExit("non-streaming marker not found")
          text = text.replace(marker, replacement, 1)
          marker = '''def test_other_streaming_adapters_fail_closed_before_image_provider_io(adapter_name: str) -> None:\n    transport = RejectingSseTransport()\n'''
          replacement = marker + "    adapter: ProviderStreamingPort\n"
          if marker not in text:
              raise SystemExit("streaming marker not found")
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY
      - uses: astral-sh/setup-uv@v6
      - name: Format test
        run: uvx --python 3.13 --from ruff==0.12.11 ruff format tests/contract/test_multimodal_input_foundation.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contract/test_multimodal_input_foundation.py
          git commit -m "test: type multimodal adapters against provider ports"
          git push origin HEAD:feat/multimodal-input-contract-v1
