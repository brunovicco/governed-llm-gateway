name: pc31-runtime-baseline-clarify

on:
  push:
    branches:
      - docs/pc31-runtime-baseline-clarification
    paths:
      - .github/workflows/pc31-runtime-baseline-clarify.yml

permissions:
  contents: write

jobs:
  clarify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Clarify runtime-bearing baseline semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          current_state = "docs/project/CURRENT_STATE.md"
          replace_once(
              current_state,
              "PC-30 squash merge / current certified baseline:",
              "PC-30 squash merge / latest certified runtime-bearing baseline:",
          )
          replace_once(
              current_state,
              "1. Keep `governed-llm-gateway/main` stable at the certified post-PC-30 baseline `594b8609634b54eec60f75a733e6aa90846face9`; further work must remain independently justified and consumer-agnostic while OpsLens is deferred.",
              "1. Treat `594b8609634b54eec60f75a733e6aa90846face9` as the latest certified runtime-bearing baseline. Documentation-only checkpoints may advance `main` without changing runtime behavior; any further functional change must still start from the then-current `main` and remain independently justified and consumer-agnostic while OpsLens is deferred.",
          )

          roadmap = "docs/project/ROADMAP.md"
          replace_once(
              roadmap,
              "Latest merged and post-merge validated baseline:",
              "Latest runtime-bearing and post-merge validated baseline:",
          )
          replace_once(
              roadmap,
              "The local-demo smoke proof uses no provider, Policy Router, SaaS or production credential. It proves only\nthe bounded operations-only local stack, real readiness and deterministic teardown.\n",
              "The local-demo smoke proof uses no provider, Policy Router, SaaS or production credential. It proves only\nthe bounded operations-only local stack, real readiness and deterministic teardown. Documentation-only\ncheckpoint commits may advance `main` without changing this runtime-bearing baseline; all new work still\nstarts from the then-current `main`.\n",
          )
          PY

          git rm .github/workflows/pc31-runtime-baseline-clarify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/CURRENT_STATE.md docs/project/ROADMAP.md
          git commit -m "docs: clarify runtime-bearing baseline semantics"
          git push origin HEAD:docs/pc31-runtime-baseline-clarification
