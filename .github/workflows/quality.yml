name: quality

on:
  push:
    branches:
      - feat/pc23-operational-evidence-binding

permissions:
  contents: write

jobs:
  format-pc23:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pc23-operational-evidence-binding
      - uses: astral-sh/setup-uv@v6
      - name: Format reported PC-23 files
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            apps/gateway-api/src/governed_llm_gateway_api/application_bootstrap.py \
            apps/gateway-api/src/governed_llm_gateway_api/operations_snapshot.py \
            tests/contract/test_gateway_server.py
          cat > .github/workflows/quality.yml <<'EOF'
          name: quality

          on:
            push:
            pull_request:

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: astral-sh/setup-uv@v6
                  with:
                    enable-cache: true
                - name: Set up Python
                  run: uv python install 3.13
                - name: Sync locked dependencies
                  run: uv sync --frozen
                - name: Quality gate
                  run: uv run python scripts/quality_gate.py
          EOF
      - name: Commit formatter output and restore workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/quality.yml \
            apps/gateway-api/src/governed_llm_gateway_api/application_bootstrap.py \
            apps/gateway-api/src/governed_llm_gateway_api/operations_snapshot.py \
            tests/contract/test_gateway_server.py
          git commit -m "style: format PC-23 operational evidence binding"
          git push origin HEAD:feat/pc23-operational-evidence-binding
