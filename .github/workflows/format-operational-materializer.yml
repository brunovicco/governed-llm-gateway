name: format-operational-materializer

on:
  push:
    branches:
      - feat/operational-evidence-materializer
    paths:
      - .github/workflows/format-operational-materializer.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Format bounded files
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            packages/gateway-core/src/governed_llm_gateway_core/application/operational_evidence.py \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/operational_samples_memory.py
          rm .github/workflows/format-operational-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/gateway-core/src/governed_llm_gateway_core/application/operational_evidence.py \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/operational_samples_memory.py \
            .github/workflows/format-operational-materializer.yml
          git commit -m "style: apply canonical Ruff formatting"
          git push
