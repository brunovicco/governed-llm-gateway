name: pc24-contract-fix

on:
  push:
    branches:
      - feat/pc24-operations-deployments
    paths:
      - .github/workflows/pc24-contract-fix.yml

permissions:
  contents: write

jobs:
  fix-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pc24-operations-deployments
          fetch-depth: 0
      - name: Update exact stale route expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path("tests/contract/test_deployment_activation.py"),
              Path("tests/contract/test_governed_service_composition.py"),
          )
          old = 'assert operations_paths == {"/v1/ops/overview"}'
          new = 'assert operations_paths == {"/v1/ops/overview", "/v1/ops/deployments"}'
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one stale Operations route assertion in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/pc24-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contract/test_deployment_activation.py tests/contract/test_governed_service_composition.py .github/workflows/pc24-contract-fix.yml
          git commit -m "test: update Operations route expectations"
          git push origin HEAD:feat/pc24-operations-deployments
