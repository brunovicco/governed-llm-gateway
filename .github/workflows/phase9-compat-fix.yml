name: phase9-compat-fix

on:
  push:
    branches:
      - feat/phase-9-opentelemetry

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-9-opentelemetry
      - name: Preserve Phase 8 internal defaults
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/gateway-api/src/governed_llm_gateway_api/stream_generate.py')
          text = path.read_text()
          old = '''    *,
    observability: Observability | None,
    trace_carrier: dict[str, str],
) -> AsyncGenerator[str]:'''
          new = '''    *,
    observability: Observability | None = None,
    trace_carrier: dict[str, str] | None = None,
) -> AsyncGenerator[str]:'''
          if old not in text:
              raise SystemExit('expected _sse_body signature not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/phase9-compat-fix.yml
      - name: Commit compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve Phase 8 streaming body defaults'
          git push origin HEAD:feat/phase-9-opentelemetry
