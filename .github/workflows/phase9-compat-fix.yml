name: phase9-compat-fix

on:
  push:
    branches:
      - feat/phase-9-opentelemetry

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-9-opentelemetry
      - name: Preserve Phase 8 internal defaults
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/gateway-api/src/governed_llm_gateway_api/stream_generate.py')
          text = path.read_text()
          text = text.replace(
              '    observability: Observability | None,\n',
              '    observability: Observability | None = None,\n',
              1,
          )
          text = text.replace(
              '    trace_carrier: dict[str, str],\n',
              '    trace_carrier: dict[str, str] | None = None,\n',
              1,
          )
          path.write_text(text)
          PY
          rm .github/workflows/phase9-compat-fix.yml
      - name: Commit compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve Phase 8 streaming body defaults'
          git push origin HEAD:feat/phase-9-opentelemetry
