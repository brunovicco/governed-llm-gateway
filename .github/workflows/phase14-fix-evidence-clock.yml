name: phase14-fix-evidence-clock

on:
  push:
    branches: [fix/sdk-terminal-execution-evidence]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/sdk-terminal-execution-evidence
      - name: Align deterministic clock with runtime calls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/contract/test_phase14_terminal_execution_evidence.py")
          text = path.read_text()
          old = '        self._readings = iter((100.0, 100.1, 100.25))\n'
          new = '        self._readings = iter((100.0, 100.25))\n'
          if old not in text:
              raise SystemExit("deterministic clock anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/phase14-fix-evidence-clock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/contract/test_phase14_terminal_execution_evidence.py .github/workflows/phase14-fix-evidence-clock.yml
          git commit -m "test: align measured terminal latency fixture"
          git push origin HEAD:fix/sdk-terminal-execution-evidence
