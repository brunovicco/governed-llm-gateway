          roadmap_baseline = '''## Current gateway baseline

Latest merged and validated baseline:

`cb0fbac9c278df3e20bf9b26b20cb06f697f4d71` (PR #42)

Post-merge `main` quality run:

`33993826048` — PASS.

Validation:

- 546 tests passed;
- aggregate coverage 82.08%;
- strict mypy passed across 151 source files;
- Ruff lint/format passed across 151 files;
- Bandit reported no issues across 13,905 LOC;
- pip-audit reported no known vulnerabilities;
- architecture check, secret scan and Phase 0 gate passed.
'''
          replace_section(
              "docs/project/ROADMAP.md",
              "## Current gateway baseline",
              "## Next boundary",
              roadmap_baseline,
          )

          roadmap_next = '''## Next boundary

Until OpsLens is ready for reconciliation:

1. keep the gateway `main` baseline stable;
2. do not start a second consumer migration in parallel;
3. perform only upstream gateway hardening that is independently justified and consumer-agnostic;
4. do not create benchmark-only routing/model-selection bypasses to force a nominal target;
5. keep live-provider benchmark execution explicitly separated from credential-free default CI and normal authorization semantics;
6. do not treat benchmark completion or runtime provenance as permission to bypass the Phase 14 order;
7. when OpsLens stabilizes, rebase/reconcile its integration against the then-current gateway commit and rerun its full native Python and Terraform CI before merge.

Do not pull work forward when doing so weakens an authority boundary, creates parallel consumer migrations or depends on an unstable consumer contract.
'''
          replace_section("docs/project/ROADMAP.md", "## Next boundary", None, roadmap_next)

          eval_matrix = '''## Workload-specific matrix — CORE 5/5 COMPLETE; MULTIMODAL EXTENSION COMPLETE

PRs #19–#24 added the initial five explicit versioned workload contracts on top of the Phase 10/11 foundation. PR #32 later added the roadmap-authorized multimodal extension after core execution and image-input foundations stabilized.

| Workload | Current reviewed contract | Core deterministic semantics |
|---|---|---|
| `structured_extraction` | `structured-extraction-v2` | bounded schema validity + exact type-sensitive leaf values |
| `rag_ptbr` | `rag-ptbr-v1` | reviewed required-fact coverage + explicit forbidden-claim regression checks |
| `code_generation` | `code-generation-v1` | normalized Python AST exactness; candidate code is never executed |
| `tool_use` | `tool-use-v1` | tool selection + exact recursive type-sensitive arguments; tool execution disabled |
| `agent_orchestration` | `agent-orchestration-v1` | observable agent/action sequence + handoff accuracy; step execution disabled |
| `multimodal_analysis` | `multimodal-analysis-v1` | actual fixture-bound image inspection with deterministic quadrant/color scoring |

`structured-extraction-v1` from PR #19 remains a historical contract. PR #22 added v2 rather than rewriting already-versioned semantics. The original `gateway-eval-v1` dataset also remains the historical five-workload generic baseline; multimodal was added as a new workload contract instead of mutating that dataset.

All workload contracts reuse the same non-authoritative evidence path:

```text
versioned dataset / fixture provenance
  -> contract validation
  -> BenchmarkRunner
  -> deterministic scorer
  -> observations + Scorecard
  -> content-addressed snapshot
  -> explicit promotion
```

The detailed workload ledger is `docs/evaluation/BENCHMARK_MATRIX.md`.
'''
          replace_section(
              "docs/project/EVALUATION.md",
              "## Workload-specific matrix — COMPLETE 5/5",
              "## Deterministic scorer boundary",
              eval_matrix,
          )

          eval_targets = '''## Versioned target matrices and execution attestation

Benchmark targets remain reviewed configuration data rather than application-code preferences.

The repository preserves three target-matrix generations:

- `benchmarks/runners/targets-v1.json`, schema `1.0`: historical provider/model/API/configuration identity;
- `benchmarks/runners/targets-v2.json`, schema `1.1`: adds explicit reviewed `api_family`;
- `benchmarks/runners/targets-v3.json`, schema `1.2`: additionally requires positive `max_output_tokens`.

Every target still records provider, exact model identifier, API surface, benchmark configuration and source date. Later schemas add explicit fields rather than parsing the opaque `configuration` string.

Gateway-backed terminal evidence can preserve:

- concrete provider/model/deployment identity;
- selected `api_family`;
- concrete provider-neutral `max_output_tokens` carried by the attempted request;
- latency, fallback position, normalized usage and optional cost.

The benchmark runner fails closed before scoring when an attested completed call contradicts the declared provider/model target, declared API family, or declared max-output value. Missing required terminal attestation evidence also fails closed. Provider failures remain availability evidence and are not converted into false configuration mismatches.

This does **not** attest arbitrary values inside `BenchmarkTarget.configuration`. Temperature, top-p, reasoning/thinking mode, access/tier labels and provider-specific controls remain declarative unless a future provider-neutral runtime contract can prove them explicitly.

Free-tier or developer-access endpoints are benchmark/development targets only. They must not receive confidential/private evaluation fixtures by default.

A result must not be described as a "best model" result unless provider, exact model, API/configuration provenance, run date and benchmark version are stated together.
'''
          replace_section(
              "docs/project/EVALUATION.md",
              "## Initial target matrix",
              "## Quality versus availability",
              eval_targets,
          )

          eval_snapshot = '''## Snapshot reproducibility

A dataset digest is derived from canonical JSON over the complete ordered benchmark case content.

Historical snapshot schema `1.0` remains valid. Its snapshot identifier covers:

- snapshot schema version;
- benchmark version;
- runner version;
- run date;
- dataset digest;
- exact benchmark targets and configurations;
- normalized observations;
- aggregated scorecards.

New snapshots may opt into schema `1.1` by supplying an explicit `target_matrix_version`. Schema 1.1 additionally stores a canonical `target_matrix_digest` over the matrix version plus the complete effective ordered target payload. Both matrix provenance fields participate in `snapshot_id`.

This makes reviewed matrix origin directly auditable while preserving historical schema 1.0 artifact shape. The matrix digest proves which target declaration was used; it does not turn every opaque configuration claim into runtime attestation.

Observed provider/model/deployment identity, `api_family` and `max_output_tokens` are serialized into benchmark observations only when present. Their presence therefore affects immutable snapshot identity without fabricating values for historical/replay evidence.

Persisted artifacts are stored under:

```text
benchmarks/results/<benchmark-version>/<snapshot-sha256>.json
```

Persistence is immutable/idempotent: an existing snapshot ID with different content fails closed. Raw provider responses are not part of the score snapshot contract.
'''
          replace_section(
              "docs/project/EVALUATION.md",
              "## Snapshot reproducibility",
              "## CI and live-provider boundary",
              eval_snapshot,
          )

          eval_ci = '''## CI and live-provider boundary

Default CI is credential-free and deterministic. It validates loaders, workload contracts, multimodal fixture integrity/publication metadata, scorers, aggregation, response normalization, attestation, reproducibility, failure classification, privacy-oriented result structure and architecture rules without live PDP/provider calls.

The repository now has provider-neutral building blocks for a future gateway-backed multimodal execution path:

1. validated `multimodal-analysis-v1` case + immutable fixture publication;
2. provider-neutral `GatewayRequest` materialization with `requirements.vision = true`;
3. ordinary gateway authorization/routing/resilience/provider execution;
4. terminal `GatewayResponse` normalization into `ProviderCall`;
5. execution-identity/API-family/max-output integrity checks before deterministic scoring.

There is still no benchmark-side model-forcing bypass and no required live-provider executor in default CI. A future live execution adapter must call an already-authorized gateway composition and fail closed if the observed terminal execution does not match the reviewed benchmark target requirements.

Credentials must remain outside the default quality gate. Public/synthetic workload fixtures do not create a policy exception for confidential/private provider use.
'''
          replace_section(
              "docs/project/EVALUATION.md",
              "## CI and live-provider boundary",
              "## Phase 11 promotion boundary",
              eval_ci,
          )

          matrix_path = Path("docs/evaluation/BENCHMARK_MATRIX.md")
          matrix_text = matrix_path.read_text(encoding="utf-8")
          matrix_text = matrix_text.replace(
              "Status: **COMPLETE — 5/5 initial roadmap workloads implemented**",
              "Status: **COMPLETE — 5/5 core workloads plus post-core multimodal extension implemented**",
          )
          matrix_path.write_text(matrix_text, encoding="utf-8")

          matrix_table = '''## Matrix

| Workload | Reviewed benchmark version | Scorer / semantics | PR |
|---|---|---|---|
| `structured_extraction` | `structured-extraction-v2` | bounded recursive schema validation + exact type-sensitive leaf-value accuracy | #19 established v1; #22 added v2 hardening |
| `rag_ptbr` | `rag-ptbr-v1` | reviewed required-fact coverage with explicit forbidden-claim regression checks | #20 |
| `code_generation` | `code-generation-v1` | normalized Python AST exactness; candidate code is never executed | #21 |
| `tool_use` | `tool-use-v1` | tool-selection score + exact recursive type-sensitive argument score; tool execution disabled | #23 |
| `agent_orchestration` | `agent-orchestration-v1` | observable agent/action sequence + handoff accuracy; agent execution disabled | #24 |
| `multimodal_analysis` | `multimodal-analysis-v1` | actual fixture-bound image inspection + deterministic quadrant/color scoring | #32 |

`structured-extraction-v1` is preserved as historical benchmark semantics. The v2 contract is the current hardened structured-extraction reference; v1 evidence must not be silently rewritten.

The original generic `gateway-eval-v1` dataset remains the historical five-workload framework baseline. `multimodal_analysis` was added as a separate post-core workload contract and does not rewrite that dataset.
'''
          replace_section(
              "docs/evaluation/BENCHMARK_MATRIX.md",
              "## Matrix",
              "## Shared evidence pipeline",
              matrix_table,
          )

          matrix_multi = '''## Post-core multimodal and evidence hardening

The roadmap allows multimodal after core execution is stable. The completed sequence is:

```text
bounded provider-neutral image input
  -> reviewed native provider translations
  -> local fixture integrity
  -> immutable public fixture publication
  -> multimodal-analysis-v1 dataset/scorer
  -> provider-neutral GatewayRequest materialization
  -> ordinary authorized gateway execution boundary
  -> GatewayResponse -> ProviderCall normalization
  -> terminal execution identity / API family / max-output attestation
  -> immutable snapshot + target-matrix provenance
```

### Runtime image input

PRs #26–#28 established HTTPS URL image input for user messages with explicit `requirements.vision = true`. Native reviewed translations exist for OpenAI Responses, Anthropic Messages and Gemini. Generic OpenAI-compatible image input remains fail closed unless its exact endpoint behavior is separately reviewed.

### Fixture and workload evidence

PRs #29–#31 added a credential-free fixture integrity/publication path. PR #32 added `multimodal-analysis-v1`, backed by the real deterministic `multimodal.quadrants_rgb_001` PNG and a deterministic four-quadrant scorer.

Default CI does not fetch the published fixture or call a provider.

### Gateway execution composition boundary

PR #33 materializes a validated multimodal case into the existing provider-neutral `GatewayRequest`; PR #34 normalizes a terminal `GatewayResponse` into benchmark `ProviderCall` evidence.

Materialization never chooses or authorizes a provider/model. The request must still pass through normal PDP authorization, gateway eligibility, ranking, resilience and execution.

### Evidence integrity and attestation

PRs #35–#42 progressively preserve and verify the execution facts that the runtime can actually prove:

- observed provider/model/deployment identity;
- terminal `api_family`;
- terminal provider-neutral `max_output_tokens`;
- explicit target schema evolution (`1.0` -> `1.1` -> `1.2`);
- optional snapshot target-matrix version/digest provenance.

Completed calls that contradict an attested target fail closed before deterministic scoring. Provider failures remain availability evidence.

Opaque configuration strings are still declarative. The benchmark does not infer temperature, top-p, reasoning/thinking mode, access tier or provider-specific controls from those strings.
'''
          replace_section(
              "docs/evaluation/BENCHMARK_MATRIX.md",
              "## Post-core multimodal extension",
              "## Authority boundary",
              matrix_multi,
          )

          matrix_ci = '''## CI boundary

Default CI remains credential-free and deterministic:

- no live provider/network dependency is required by workload contract tests;
- no LLM-as-judge path is required;
- public/synthetic fixtures are used;
- workload/target/attestation contract drift fails closed;
