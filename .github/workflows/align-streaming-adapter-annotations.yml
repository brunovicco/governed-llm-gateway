name: align-streaming-adapter-annotations

on:
  push:
    branches:
      - feat/multimodal-input-contract-v1

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align closeable streaming annotations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              "packages/gateway-core/src/governed_llm_gateway_core/adapters/anthropic_streaming.py",
              "packages/gateway-core/src/governed_llm_gateway_core/adapters/gemini_streaming.py",
              "packages/gateway-core/src/governed_llm_gateway_core/adapters/openai_compatible_streaming.py",
          )
          for name in paths:
              path = Path(name)
              text = path.read_text()
              if "from collections.abc import AsyncIterator" not in text:
                  raise SystemExit(f"missing AsyncIterator import in {name}")
              text = text.replace(
                  "from collections.abc import AsyncIterator",
                  "from collections.abc import AsyncGenerator",
                  1,
              )
              marker = ") -> AsyncIterator[ProviderStreamEvent]:"
              if marker not in text:
                  raise SystemExit(f"missing stream annotation in {name}")
              text = text.replace(marker, ") -> AsyncGenerator[ProviderStreamEvent]:", 1)
              path.write_text(text)
          PY
      - uses: astral-sh/setup-uv@v6
      - name: Format changed adapters
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/anthropic_streaming.py \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/gemini_streaming.py \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/openai_compatible_streaming.py
      - name: Commit annotation alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/gateway-core/src/governed_llm_gateway_core/adapters/*_streaming.py
          git commit -m "fix: align streaming adapters with closeable port"
          git push origin HEAD:feat/multimodal-input-contract-v1
