name: phase12-iterator-fix

on:
  push:
    branches:
      - feat/phase-12-client-sdk
    paths:
      - .github/workflows/phase12-iterator-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Apply bounded identity-only iterator compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "packages/gateway-client/src/governed_llm_gateway_client/_codec.py",
              "packages/gateway-client/src/governed_llm_gateway_client/client.py",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              count = text.count("response.aiter_raw(")
              if count != 1:
                  raise SystemExit(f"expected one raw iterator in {name}, found {count}")
              path.write_text(text.replace("response.aiter_raw(", "response.aiter_bytes("), encoding="utf-8")

          test = Path("tests/contract/test_phase12_client_protocol_hardening.py")
          text = test.read_text(encoding="utf-8")
          old = '''                content=_sse(\n                    StreamEventType.RESPONSE_COMPLETED,\n                    1,\n                    routing=_routing_payload(),\n                ),\n'''
          new = '''                stream=_ChunkedStream((b"compressed-sse-body-not-read",)),\n'''
          if text.count(old) != 1:
              raise SystemExit("encoded SSE test block not found")
          text = text.replace(old, new, 1)

          old = '''                json={"detail": {"code": sensitive_code}},\n'''
          new = '''                stream=_ChunkedStream(\n                    (b'{"detail":{"code":"compressed-sensitive-detail"}}',)\n                ),\n'''
          if text.count(old) != 1:
              raise SystemExit("encoded HTTP error test block not found")
          test.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            packages/gateway-client/src/governed_llm_gateway_client \
            tests/contract/test_phase12_client_protocol_hardening.py
          uvx --python 3.13 --from ruff==0.12.11 ruff check \
            packages/gateway-client/src/governed_llm_gateway_client \
            tests/contract/test_phase12_client_protocol_hardening.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/gateway-client tests/contract/test_phase12_client_protocol_hardening.py
          git commit -m "fix: preserve bounded reads across HTTPX transports"
          git push origin HEAD:feat/phase-12-client-sdk
