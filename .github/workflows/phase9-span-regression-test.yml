name: phase9-span-regression-test

on:
  push:
    branches:
      - feat/phase-9-opentelemetry

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-9-opentelemetry
      - uses: astral-sh/setup-uv@v6
      - name: Add provider span backoff regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/contract/test_phase9_observability.py')
          lines = path.read_text().splitlines()
          function = (
              'def test_provider_attempts_keep_one_trace_and_emit_retry_and_fallback_events() -> None:'
          )
          start = lines.index(function)
          end = lines.index('async def _no_sleep(delay: float) -> None:', start)
          obs = '    observability, exporter = _observability()'
          i = lines.index(obs, start, end)
          lines[i + 1:i + 1] = [
              '    finished_before_sleep: list[int] = []',
              '',
              '    async def assert_attempt_span_closed(delay: float) -> None:',
              '        assert delay >= 0',
              '        finished_before_sleep.append(',
              '            len(',
              '                [',
              '                    span',
              '                    for span in exporter.get_finished_spans()',
              '                    if span.name == "provider.inference"',
              '                ]',
              '            )',
              '        )',
              '',
          ]
          sleeper = '        sleeper=_no_sleep,'
          i = lines.index(sleeper, start, end + 14)
          lines[i] = '        sleeper=assert_attempt_span_closed,'
          result_assert = '    assert result.deployment.deployment_id == "deployment-b"'
          i = lines.index(result_assert, start, end + 14)
          lines.insert(i + 1, '    assert finished_before_sleep == [1]')
          path.write_text('\n'.join(lines) + '\n')
          PY
          uvx --python 3.13 --from ruff==0.12.11 ruff format tests/contract/test_phase9_observability.py
          uvx --python 3.13 --from ruff==0.12.11 ruff check tests/contract/test_phase9_observability.py
          rm .github/workflows/phase9-span-regression-test.yml
      - name: Commit regression test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: assert provider span closes before backoff'
          git push origin HEAD:feat/phase-9-opentelemetry
