name: fix-operational-evidence-bool-validation

on:
  push:
    branches:
      - feat/versioned-operational-evidence
    paths:
      - .github/workflows/fix-operational-evidence-bool-validation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/versioned-operational-evidence
      - name: Harden direct domain construction
        run: |
          python - <<'PY'
          from pathlib import Path

          domain = Path("packages/gateway-core/src/governed_llm_gateway_core/domain/operational_evidence.py")
          text = domain.read_text()
          old = '''    _validate_identifier(record.deployment_id, "deployment_id")
    if record.gateway_request_count <= 0:
'''
          new = '''    _validate_identifier(record.deployment_id, "deployment_id")
    integer_fields = {
        "gateway_request_count": record.gateway_request_count,
        "provider_attempt_count": record.provider_attempt_count,
        "successful_provider_attempt_count": record.successful_provider_attempt_count,
        "provider_error_count": record.provider_error_count,
        "rate_limit_error_count": record.rate_limit_error_count,
        "timeout_count": record.timeout_count,
        "fallback_request_count": record.fallback_request_count,
        "provider_latency_p50_ms": record.provider_latency_p50_ms,
        "provider_latency_p95_ms": record.provider_latency_p95_ms,
    }
    for name, value in integer_fields.items():
        if isinstance(value, bool) or not isinstance(value, int):
            raise OperationalEvidenceError(f"{name} must be an integer")
    if record.gateway_request_count <= 0:
'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one record-validation marker")
          domain.write_text(text.replace(old, new))

          tests = Path("tests/contract/test_operational_evidence.py")
          test_text = tests.read_text()
          marker = '''def test_direct_record_construction_preserves_fail_closed_invariants() -> None:
'''
          addition = '''def test_direct_record_construction_rejects_boolean_counts() -> None:
    with pytest.raises(OperationalEvidenceError, match="gateway_request_count must be an integer"):
        OperationalEvidenceRecord(
            runtime_workload="rag.answer",
            deployment_id="openai-primary",
            gateway_request_count=True,
            provider_attempt_count=10,
            successful_provider_attempt_count=10,
            provider_error_count=0,
            rate_limit_error_count=0,
            timeout_count=0,
            fallback_request_count=0,
            provider_latency_p50_ms=100,
            provider_latency_p95_ms=200,
        )

    with pytest.raises(OperationalEvidenceError, match="provider_latency_p50_ms must be an integer"):
        OperationalEvidenceRecord(
            runtime_workload="rag.answer",
            deployment_id="openai-primary",
            gateway_request_count=10,
            provider_attempt_count=10,
            successful_provider_attempt_count=10,
            provider_error_count=0,
            rate_limit_error_count=0,
            timeout_count=0,
            fallback_request_count=0,
            provider_latency_p50_ms=False,
            provider_latency_p95_ms=200,
        )


'''
          if test_text.count(marker) != 1:
              raise SystemExit("expected exactly one direct-record test marker")
          tests.write_text(test_text.replace(marker, addition + marker))
          PY
          git diff --check
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/gateway-core/src/governed_llm_gateway_core/domain/operational_evidence.py \
                  tests/contract/test_operational_evidence.py
          git commit -m "fix: reject boolean operational evidence counters"
          git push origin HEAD:feat/versioned-operational-evidence
