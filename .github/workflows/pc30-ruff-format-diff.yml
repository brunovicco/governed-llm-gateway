name: pc30-ruff-format-diff

on:
  push:
    branches:
      - feat/pc30-local-demo-orchestration
    paths:
      - scripts/local_demo.py
      - .github/workflows/pc30-ruff-format-diff.yml

permissions:
  contents: write

jobs:
  ruff-format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Apply canonical format and remove diagnostic workflow
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format scripts/local_demo.py
          git rm .github/workflows/pc30-ruff-format-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/local_demo.py
          git commit -m "style: apply canonical local demo formatting"
          git push origin HEAD:feat/pc30-local-demo-orchestration
