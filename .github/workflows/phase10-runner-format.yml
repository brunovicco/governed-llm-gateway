name: phase10-runner-format

on:
  push:
    branches:
      - feat/phase-10-evaluation-framework

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-10-evaluation-framework
      - uses: astral-sh/setup-uv@v6
      - name: Apply pinned Ruff formatter
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format benchmarks/runner.py
          rm .github/workflows/phase10-runner-format.yml
      - name: Commit formatting result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/runner.py .github/workflows/phase10-runner-format.yml
          git diff --cached --exit-code && exit 0
          git commit -m "style: format Phase 10 benchmark runner"
          git push origin HEAD:feat/phase-10-evaluation-framework
