name: Format tool use once

on:
  push:
    branches:
      - feat/benchmark-tool-use-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Format workload
        run: uvx --python 3.13 --from ruff==0.12.11 ruff format benchmarks/workloads/tool_use.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/workloads/tool_use.py
          git commit -m "style: apply tool use formatter"
          git push
