name: pc31-next-boundary-clarify

on:
  push:
    branches:
      - docs/pc31-runtime-baseline-clarification
    paths:
      - .github/workflows/pc31-next-boundary-clarify.yml

permissions:
  contents: write

jobs:
  clarify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Clarify current-main working rule
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/project/ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          old = "1. keep the gateway `main` baseline stable;"
          new = "1. start every new increment from the then-current `main` and preserve the certified runtime-bearing behavior unless a separately justified increment changes it;"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one match, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git rm .github/workflows/pc31-next-boundary-clarify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/ROADMAP.md
          git commit -m "docs: clarify current-main working rule"
          git push origin HEAD:docs/pc31-runtime-baseline-clarification
