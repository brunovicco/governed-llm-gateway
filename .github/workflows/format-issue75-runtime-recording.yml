name: format-issue75-runtime-recording

on:
  push:
    branches:
      - feat/runtime-operational-attempt-recording
    paths:
      - .github/workflows/format-issue75-runtime-recording.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-operational-attempt-recording
      - uses: astral-sh/setup-uv@v6
      - name: Format issue 75 Python files
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/operational_samples_memory.py \
            packages/gateway-core/src/governed_llm_gateway_core/application/operational_evidence.py \
            packages/gateway-core/src/governed_llm_gateway_core/application/operational_recording.py \
            packages/gateway-core/src/governed_llm_gateway_core/application/resilience.py \
            packages/gateway-core/src/governed_llm_gateway_core/application/streaming.py \
            tests/contract/test_operational_runtime_recording.py
      - name: Remove temporary formatter workflow
        run: rm .github/workflows/format-issue75-runtime-recording.yml
      - name: Commit canonical formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'style: format runtime operational recording'
          git push origin HEAD:feat/runtime-operational-attempt-recording
