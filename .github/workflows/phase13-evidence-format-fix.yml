name: phase13-evidence-format-fix
on:
  push:
    branches: [feat/phase-13-governance-integration]
    paths: [.github/workflows/phase13-evidence-format-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Apply Ruff fixes
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff check --fix \
            packages/gateway-core/src/governed_llm_gateway_core/application/__init__.py \
            packages/gateway-core/src/governed_llm_gateway_core/application/governance_evidence.py \
            packages/gateway-core/src/governed_llm_gateway_core/domain/governance.py
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            packages/gateway-core/src/governed_llm_gateway_core/application/__init__.py \
            packages/gateway-core/src/governed_llm_gateway_core/application/governance_evidence.py \
            packages/gateway-core/src/governed_llm_gateway_core/domain/governance.py \
            tests/contract/test_phase13_governance_evidence.py
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/phase13-evidence-format-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: finalize Phase 13 governance evidence formatting'
          git push origin HEAD:feat/phase-13-governance-integration
