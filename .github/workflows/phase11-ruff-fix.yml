name: phase11-ruff-fix

on:
  push:
    branches:
      - feat/phase-11-evidence-driven-ranking
    paths:
      - .github/workflows/phase11-ruff-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-11-evidence-driven-ranking
      - uses: astral-sh/setup-uv@v6
      - name: Apply scoped Ruff fixes
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff check --fix \
            packages/gateway-core/src/governed_llm_gateway_core/domain/evidence_ranking.py \
            tests/contract/test_phase11_evidence_ranking.py \
            tests/contract/test_phase11_ranking_evidence.py \
            tests/contract/test_phase11_ranking_evidence_json.py
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            packages/gateway-core/src/governed_llm_gateway_core/domain/evidence_ranking.py \
            tests/contract/test_phase11_evidence_ranking.py \
            tests/contract/test_phase11_ranking_evidence.py \
            tests/contract/test_phase11_ranking_evidence_json.py
      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase11-ruff-fix.yml
          git add packages/gateway-core/src/governed_llm_gateway_core/domain/evidence_ranking.py \
            tests/contract/test_phase11_evidence_ranking.py \
            tests/contract/test_phase11_ranking_evidence.py \
            tests/contract/test_phase11_ranking_evidence_json.py
          git commit -m "style: normalize Phase 11 evidence ranking"
          git push origin HEAD:feat/phase-11-evidence-driven-ranking
