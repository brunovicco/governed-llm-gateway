name: format-benchmark-max-output

on:
  push:
    branches:
      - feat/benchmark-target-max-output-attestation-v1
    paths:
      - .github/workflows/format-benchmark-max-output.yml
      - benchmarks/runner.py
      - tests/contract/test_benchmark_max_output_gateway_normalization.py

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/benchmark-target-max-output-attestation-v1
      - uses: astral-sh/setup-uv@v6
      - name: Apply authoritative Ruff fixes
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff check --fix benchmarks/runner.py tests/contract/test_benchmark_max_output_gateway_normalization.py
          uvx --python 3.13 --from ruff==0.12.11 ruff format benchmarks/runner.py tests/contract/test_benchmark_max_output_gateway_normalization.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/runner.py tests/contract/test_benchmark_max_output_gateway_normalization.py
          git commit -m "style: apply benchmark max-output Ruff fixes"
          git push origin HEAD:feat/benchmark-target-max-output-attestation-v1
