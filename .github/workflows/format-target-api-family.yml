name: format-target-api-family

on:
  push:
    branches:
      - feat/benchmark-target-api-family-attestation-v1
    paths:
      - .github/workflows/format-target-api-family.yml
      - benchmarks/targets.py
      - tests/contract/test_benchmark_target_api_family_attestation.py

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/benchmark-target-api-family-attestation-v1
      - uses: astral-sh/setup-uv@v6
      - name: Format target attestation files
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format benchmarks/targets.py tests/contract/test_benchmark_target_api_family_attestation.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/targets.py tests/contract/test_benchmark_target_api_family_attestation.py
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:feat/benchmark-target-api-family-attestation-v1
