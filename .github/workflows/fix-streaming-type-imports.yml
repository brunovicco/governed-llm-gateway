name: fix-streaming-type-imports

on:
  push:
    branches:
      - feat/multimodal-input-contract-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep iterator imports for internal helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              "packages/gateway-core/src/governed_llm_gateway_core/adapters/gemini_streaming.py",
              "packages/gateway-core/src/governed_llm_gateway_core/adapters/openai_compatible_streaming.py",
          ):
              path = Path(name)
              text = path.read_text()
              old = "from collections.abc import AsyncGenerator"
              new = "from collections.abc import AsyncGenerator, AsyncIterator"
              if old not in text:
                  raise SystemExit(f"missing AsyncGenerator import in {name}")
              path.write_text(text.replace(old, new, 1))
          PY
      - uses: astral-sh/setup-uv@v6
      - run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/gemini_streaming.py \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/openai_compatible_streaming.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/gateway-core/src/governed_llm_gateway_core/adapters/gemini_streaming.py \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/openai_compatible_streaming.py
          git commit -m "fix: retain iterator types for streaming helpers"
          git push origin HEAD:feat/multimodal-input-contract-v1
