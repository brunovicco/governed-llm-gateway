name: phase13-typed-enum-fix

on:
  push:
    branches:
      - feat/phase-13-governance-integration
    paths:
      - .github/workflows/phase13-typed-enum-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Split enum parsers by trusted contract type
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/gateway-core/src/governed_llm_gateway_core/adapters/governance_authorization.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'risk_level = _require_enum(scope["risk_tier"], RiskLevel, "scope.risk_tier")',
                  'risk_level = _require_risk_level(scope["risk_tier"], "scope.risk_tier")',
              ),
              (
                  '''data_classification = _require_enum(\n        scope["data_classification"], DataClassification, "scope.data_classification"\n    )''',
                  '''data_classification = _require_data_classification(\n        scope["data_classification"], "scope.data_classification"\n    )''',
              ),
              (
                  '''classes = _require_enum_tuple(\n            model["allowed_data_classes"],\n            DataClassification,\n            f"scope.models[{index}].allowed_data_classes",\n        )''',
                  '''classes = _require_data_classification_tuple(\n            model["allowed_data_classes"],\n            f"scope.models[{index}].allowed_data_classes",\n        )''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one typed enum call block: {old!r}")
              text = text.replace(old, new, 1)

          old_helpers = '''def _require_enum_tuple(\n    value: object, enum_type: type[DataClassification], context: str\n) -> tuple[DataClassification, ...]:\n    return tuple(_require_enum(item, enum_type, context) for item in _require_list(value, context))\n\n\ndef _require_enum(\n    value: object, enum_type: type[RiskLevel] | type[DataClassification], context: str\n) -> RiskLevel | DataClassification:\n    text = _require_string(value, context)\n    try:\n        return enum_type(text)\n    except ValueError as exc:\n        raise GovernanceAuthorizationVerificationError(\n            f"{context} contains an unsupported value"\n        ) from exc\n'''
          new_helpers = '''def _require_risk_level(value: object, context: str) -> RiskLevel:\n    text = _require_string(value, context)\n    try:\n        return RiskLevel(text)\n    except ValueError as exc:\n        raise GovernanceAuthorizationVerificationError(\n            f"{context} contains an unsupported value"\n        ) from exc\n\n\ndef _require_data_classification(value: object, context: str) -> DataClassification:\n    text = _require_string(value, context)\n    try:\n        return DataClassification(text)\n    except ValueError as exc:\n        raise GovernanceAuthorizationVerificationError(\n            f"{context} contains an unsupported value"\n        ) from exc\n\n\ndef _require_data_classification_tuple(\n    value: object, context: str\n) -> tuple[DataClassification, ...]:\n    return tuple(\n        _require_data_classification(item, context) for item in _require_list(value, context)\n    )\n'''
          if text.count(old_helpers) != 1:
              raise SystemExit("generic enum helper block not found exactly once")
          path.write_text(text.replace(old_helpers, new_helpers, 1), encoding="utf-8")
          PY
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/governance_authorization.py
          uvx --python 3.13 --from ruff==0.12.11 ruff check \
            packages/gateway-core/src/governed_llm_gateway_core/adapters/governance_authorization.py
      - name: Commit typed fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase13-typed-enum-fix.yml
          git add packages/gateway-core/src/governed_llm_gateway_core/adapters/governance_authorization.py
          git commit -m "fix: type governance enum parsing explicitly"
          git push origin HEAD:feat/phase-13-governance-integration
