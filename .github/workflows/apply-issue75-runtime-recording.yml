name: apply-issue75-runtime-recording

on:
  push:
    branches:
      - feat/runtime-operational-attempt-recording
    paths:
      - .github/workflows/apply-issue75-runtime-recording.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-operational-attempt-recording
      - uses: astral-sh/setup-uv@v6
      - name: Apply reviewed patch
        run: uv run python scripts/apply_issue75_runtime_recording.py
      - name: Remove temporary patcher
        run: |
          rm scripts/apply_issue75_runtime_recording.py
          rm .github/workflows/apply-issue75-runtime-recording.yml
      - name: Commit patched runtime recording
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'feat: add best-effort runtime attempt recording'
          git push origin HEAD:feat/runtime-operational-attempt-recording
