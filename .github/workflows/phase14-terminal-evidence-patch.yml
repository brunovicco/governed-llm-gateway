name: phase14-terminal-evidence-patch

on:
  push:
    branches: [fix/sdk-terminal-execution-evidence]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/sdk-terminal-execution-evidence
      - name: Apply evidence propagation patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1))

          contracts = "packages/gateway-contracts/src/governed_llm_gateway_contracts/contracts.py"
          replace(contracts, '"""Immutable provider-neutral contracts for the Governed LLM Gateway."""\n', '"""Immutable provider-neutral contracts for the Governed LLM Gateway."""\n\nfrom __future__ import annotations\n')
          replace(contracts, '    usage: Usage | None = None\n    finish_reason: str | None = None\n', '    usage: Usage | None = None\n    execution: ProviderExecution | None = None\n    finish_reason: str | None = None\n')
          replace(contracts, '        elif self.event_type is StreamEventType.RESPONSE_COMPLETED:\n            self._require(routing=True)\n        elif self.event_type is StreamEventType.RESPONSE_FAILED:\n            if self.error is None:\n                raise ValueError("response.failed requires error")\n            self._require(routing=True)\n', '        elif self.event_type is StreamEventType.RESPONSE_COMPLETED:\n            self._require(routing=True)\n            self._validate_execution(ExecutionStatus.SUCCEEDED, required=True)\n        elif self.event_type is StreamEventType.RESPONSE_FAILED:\n            if self.error is None:\n                raise ValueError("response.failed requires error")\n            self._require(routing=True)\n            self._validate_execution(ExecutionStatus.FAILED, required=False)\n')
          replace(contracts, '        if self.error is not None and self.event_type is not StreamEventType.RESPONSE_FAILED:\n            raise ValueError("error is only valid on response.failed")\n\n\n@dataclass(frozen=True, slots=True)\nclass ProviderExecution:\n', '        if self.error is not None and self.event_type is not StreamEventType.RESPONSE_FAILED:\n            raise ValueError("error is only valid on response.failed")\n        if self.execution is not None and self.event_type not in {\n            StreamEventType.RESPONSE_COMPLETED,\n            StreamEventType.RESPONSE_FAILED,\n        }:\n            raise ValueError("execution is only valid on terminal response events")\n\n    def _validate_execution(self, status: ExecutionStatus, *, required: bool) -> None:\n        execution = self.execution\n        if execution is None:\n            if required:\n                raise ValueError(f"{self.event_type.value} requires provider execution evidence")\n            return\n        if not isinstance(execution, ProviderExecution):\n            raise ValueError("execution must use the provider-neutral ProviderExecution contract")\n        if execution.status is not status:\n            raise ValueError("terminal execution status does not match response event status")\n        routing = self.routing\n        if routing is None:\n            raise ValueError("terminal execution evidence requires routing provenance")\n        if (execution.provider, execution.model, execution.deployment) != (\n            routing.provider,\n            routing.model,\n            routing.deployment,\n        ):\n            raise ValueError("terminal execution evidence does not match routing provenance")\n\n\n@dataclass(frozen=True, slots=True)\nclass ProviderExecution:\n')
          replace(contracts, '    usage: Usage = field(default_factory=Usage)\n\n\n@dataclass(frozen=True, slots=True)\nclass GatewayResponse:\n', '    usage: Usage | None = None\n\n    def __post_init__(self) -> None:\n        """Validate concrete provider identity and measured execution metadata."""\n        if any(not value.strip() for value in (self.provider, self.model, self.deployment)):\n            raise ValueError("provider execution identity must be non-empty")\n        if self.latency_ms < 0:\n            raise ValueError("provider execution latency_ms must be non-negative")\n\n\n@dataclass(frozen=True, slots=True)\nclass GatewayResponse:\n')

          provider = "packages/gateway-core/src/governed_llm_gateway_core/application/provider.py"
          replace(provider, 'from collections.abc import AsyncGenerator\nfrom dataclasses import dataclass, field\n', 'from collections.abc import AsyncGenerator\nfrom dataclasses import dataclass, field\nfrom decimal import Decimal\n')
          replace(provider, '    output_tokens: int = 0\n\n    def __post_init__(self) -> None:\n', '    output_tokens: int = 0\n    total_cost_usd: Decimal | None = None\n\n    def __post_init__(self) -> None:\n')
          replace(provider, '        if self.input_tokens < 0 or self.output_tokens < 0:\n            raise ValueError("provider token usage must be non-negative")\n', '        if self.input_tokens < 0 or self.output_tokens < 0:\n            raise ValueError("provider token usage must be non-negative")\n        if self.total_cost_usd is not None and self.total_cost_usd < 0:\n            raise ValueError("provider total_cost_usd must be non-negative")\n')

          streaming = "packages/gateway-core/src/governed_llm_gateway_core/application/streaming.py"
          replace(streaming, '    GatewayRequest,\n    GatewayStreamEvent,\n    RoutingProvenance,\n', '    ExecutionStatus,\n    GatewayRequest,\n    GatewayStreamEvent,\n    ProviderExecution,\n    RoutingProvenance,\n')
          replace(streaming, '        last_error: ProviderError | None = None\n        last_routing = decision.routing\n', '        last_error: ProviderError | None = None\n        last_execution: ProviderExecution | None = None\n        last_routing = decision.routing\n')
          replace(streaming, '                usage_seen = False\n                sequence = 0\n', '                usage_seen = False\n                final_usage: Usage | None = None\n                sequence = 0\n')
          replace(streaming, '                                    sequence += 1\n                                    yield GatewayStreamEvent(\n                                        event_type=StreamEventType.USAGE_COMPLETED,\n                                        request_id=request.request_id,\n                                        sequence_number=sequence,\n                                        usage=Usage(\n                                            input_tokens=event.usage.input_tokens,\n                                            output_tokens=event.usage.output_tokens,\n                                        ),\n                                    )\n', '                                    final_usage = Usage(\n                                        input_tokens=event.usage.input_tokens,\n                                        output_tokens=event.usage.output_tokens,\n                                        total_cost_usd=event.usage.total_cost_usd,\n                                    )\n                                    sequence += 1\n                                    yield GatewayStreamEvent(\n                                        event_type=StreamEventType.USAGE_COMPLETED,\n                                        request_id=request.request_id,\n                                        sequence_number=sequence,\n                                        usage=final_usage,\n                                    )\n')
          replace(streaming, '                                    sequence += 1\n                                    yield GatewayStreamEvent(\n                                        event_type=StreamEventType.RESPONSE_COMPLETED,\n                                        request_id=request.request_id,\n                                        sequence_number=sequence,\n                                        routing=routing,\n                                        finish_reason=event.finish_reason,\n                                    )\n', '                                    if final_usage is None:\n                                        raise _invalid_stream_event(\n                                            deployment.provider,\n                                            "provider completed without normalized final usage",\n                                        )\n                                    execution = ProviderExecution(\n                                        provider=deployment.provider,\n                                        model=deployment.model_id,\n                                        deployment=deployment_id,\n                                        status=ExecutionStatus.SUCCEEDED,\n                                        latency_ms=latency_ms,\n                                        usage=final_usage,\n                                    )\n                                    sequence += 1\n                                    yield GatewayStreamEvent(\n                                        event_type=StreamEventType.RESPONSE_COMPLETED,\n                                        request_id=request.request_id,\n                                        sequence_number=sequence,\n                                        routing=routing,\n                                        execution=execution,\n                                        finish_reason=event.finish_reason,\n                                    )\n')
          replace(streaming, '                        last_error = exc\n                        if span is not None:\n', '                        last_error = exc\n                        last_execution = ProviderExecution(\n                            provider=deployment.provider,\n                            model=deployment.model_id,\n                            deployment=deployment_id,\n                            status=ExecutionStatus.FAILED,\n                            latency_ms=latency_ms,\n                            usage=final_usage,\n                        )\n                        if span is not None:\n')
          replace(streaming, '                                retryable=False,\n                                partial=True,\n                            )\n', '                                retryable=False,\n                                partial=True,\n                                execution=last_execution,\n                            )\n')
          replace(streaming, '                                retryable=False,\n                                partial=False,\n                            )\n                            return\n\n                if retry_delay_after_span is not None:\n', '                                retryable=False,\n                                partial=False,\n                                execution=last_execution,\n                            )\n                            return\n\n                if retry_delay_after_span is not None:\n')
          replace(streaming, '            retryable=retryable,\n            partial=False,\n        )\n', '            retryable=retryable,\n            partial=False,\n            execution=last_execution,\n        )\n')
          replace(streaming, '    retryable: bool,\n    partial: bool,\n) -> GatewayStreamEvent:\n', '    retryable: bool,\n    partial: bool,\n    execution: ProviderExecution | None = None,\n) -> GatewayStreamEvent:\n')
          replace(streaming, '        routing=routing,\n        error=GatewayError(code=code, message=message, retryable=retryable),\n', '        routing=routing,\n        execution=execution,\n        error=GatewayError(code=code, message=message, retryable=retryable),\n')

          api = "apps/gateway-api/src/governed_llm_gateway_api/stream_generate.py"
          replace(api, '    if event.finish_reason is not None:\n        payload["finish_reason"] = event.finish_reason\n', '    if event.execution is not None:\n        execution: dict[str, object] = {\n            "provider": event.execution.provider,\n            "model": event.execution.model,\n            "deployment": event.execution.deployment,\n            "status": event.execution.status.value,\n            "latency_ms": event.execution.latency_ms,\n        }\n        if event.execution.usage is not None:\n            execution_usage: dict[str, object] = {\n                "input_tokens": event.execution.usage.input_tokens,\n                "output_tokens": event.execution.usage.output_tokens,\n            }\n            if event.execution.usage.total_cost_usd is not None:\n                execution_usage["total_cost_usd"] = _canonical_decimal(\n                    event.execution.usage.total_cost_usd\n                )\n            execution["usage"] = execution_usage\n        payload["execution"] = execution\n    if event.finish_reason is not None:\n        payload["finish_reason"] = event.finish_reason\n')

          codec = "packages/gateway-client/src/governed_llm_gateway_client/_codec.py"
          replace(codec, '    CandidateRejection,\n    GatewayError,\n', '    CandidateRejection,\n    ExecutionStatus,\n    GatewayError,\n')
          replace(codec, '    PolicyProvenance,\n    RejectionReason,\n', '    PolicyProvenance,\n    ProviderExecution,\n    RejectionReason,\n')
          replace(codec, '        "usage",\n        "finish_reason",\n', '        "usage",\n        "execution",\n        "finish_reason",\n')
          replace(codec, '_USAGE_FIELDS = frozenset({"input_tokens", "output_tokens", "total_cost_usd"})\n_ERROR_FIELDS', '_USAGE_FIELDS = frozenset({"input_tokens", "output_tokens", "total_cost_usd"})\n_EXECUTION_FIELDS = frozenset({"provider", "model", "deployment", "status", "latency_ms", "usage"})\n_ERROR_FIELDS')
          replace(codec, '        usage_value = payload.get("usage")\n        error_value = payload.get("error")\n', '        usage_value = payload.get("usage")\n        execution_value = payload.get("execution")\n        error_value = payload.get("error")\n')
          replace(codec, '            usage=_decode_usage(_as_object(usage_value, "usage"))\n            if usage_value is not None\n            else None,\n            finish_reason=', '            usage=_decode_usage(_as_object(usage_value, "usage"))\n            if usage_value is not None\n            else None,\n            execution=_decode_execution(_as_object(execution_value, "execution"))\n            if execution_value is not None\n            else None,\n            finish_reason=')
          replace(codec, '\n\ndef _decode_error(payload: dict[str, object]) -> GatewayError:\n', '\n\ndef _decode_execution(payload: dict[str, object]) -> ProviderExecution:\n    _check_fields(payload, _EXECUTION_FIELDS, "provider execution")\n    usage_value = payload.get("usage")\n    return ProviderExecution(\n        provider=_required_str(payload, "provider"),\n        model=_required_str(payload, "model"),\n        deployment=_required_str(payload, "deployment"),\n        status=ExecutionStatus(_required_str(payload, "status")),\n        latency_ms=_required_int(payload, "latency_ms"),\n        usage=_decode_usage(_as_object(usage_value, "execution usage"))\n        if usage_value is not None\n        else None,\n    )\n\n\ndef _decode_error(payload: dict[str, object]) -> GatewayError:\n')

          client = "packages/gateway-client/src/governed_llm_gateway_client/client.py"
          replace(client, '    ToolDefinition,\n    WorkloadRequirements,\n', '    ToolDefinition,\n    Usage,\n    WorkloadRequirements,\n')
          replace(client, '        tool_calls: list[ToolCall] = []\n        terminal: GatewayStreamEvent | None = None\n', '        tool_calls: list[ToolCall] = []\n        observed_usage: Usage | None = None\n        terminal: GatewayStreamEvent | None = None\n')
          replace(client, '            elif event.event_type is StreamEventType.TOOL_CALL_COMPLETED:\n                if event.tool_call is None:\n                    raise GatewayProtocolError("completed tool-call event is missing tool_call")\n                tool_calls.append(event.tool_call)\n', '            elif event.event_type is StreamEventType.TOOL_CALL_COMPLETED:\n                if event.tool_call is None:\n                    raise GatewayProtocolError("completed tool-call event is missing tool_call")\n                tool_calls.append(event.tool_call)\n            elif event.event_type is StreamEventType.USAGE_COMPLETED:\n                if event.usage is None:\n                    raise GatewayProtocolError("usage-completed event is missing normalized usage")\n                if observed_usage is not None:\n                    raise GatewayProtocolError("gateway stream emitted final usage more than once")\n                observed_usage = event.usage\n')
          replace(client, '        if terminal.event_type is StreamEventType.RESPONSE_COMPLETED:\n            return GatewayResponse(\n', '        if terminal.event_type is StreamEventType.RESPONSE_COMPLETED:\n            if terminal.execution is None:\n                raise GatewayProtocolError("completed gateway response is missing execution evidence")\n            if observed_usage is None or terminal.execution.usage != observed_usage:\n                raise GatewayProtocolError(\n                    "terminal execution usage does not match normalized stream usage"\n                )\n            return GatewayResponse(\n')
          replace(client, '                routing=terminal.routing,\n                execution=None,\n                error=None,\n', '                routing=terminal.routing,\n                execution=terminal.execution,\n                error=None,\n')
          replace(client, '        if terminal.error is None:\n            raise GatewayProtocolError("failed terminal event is missing normalized gateway error")\n        return GatewayResponse(\n', '        if terminal.error is None:\n            raise GatewayProtocolError("failed terminal event is missing normalized gateway error")\n        if (\n            terminal.execution is not None\n            and terminal.execution.usage is not None\n            and terminal.execution.usage != observed_usage\n        ):\n            raise GatewayProtocolError(\n                "failed terminal execution usage does not match normalized stream usage"\n            )\n        return GatewayResponse(\n')
          replace(client, '            routing=terminal.routing,\n            execution=None,\n            error=terminal.error,\n', '            routing=terminal.routing,\n            execution=terminal.execution,\n            error=terminal.error,\n')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/phase14-terminal-evidence-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/gateway-contracts packages/gateway-core apps/gateway-api packages/gateway-client .github/workflows/phase14-terminal-evidence-patch.yml
          git commit -m "fix: preserve terminal provider execution evidence"
          git push origin HEAD:fix/sdk-terminal-execution-evidence
