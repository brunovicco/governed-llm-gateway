name: Apply Phase14 evidence expansion

on:
  push:
    branches: [feat/provider-neutral-planner-evidence]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-neutral-planner-evidence
      - uses: astral-sh/setup-uv@v6
      - name: Expand provider-neutral execution evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected fragment not found: {path}')
              p.write_text(text.replace(old, new))

          contracts = 'packages/gateway-contracts/src/governed_llm_gateway_contracts/contracts.py'
          replace(
              contracts,
              '''class Usage:\n    """Normalized token and cost metadata."""\n\n    input_tokens: int = 0\n    output_tokens: int = 0\n    total_cost_usd: Decimal | None = None\n\n    def __post_init__(self) -> None:\n        """Reject impossible usage values rather than silently normalizing them."""\n        if self.input_tokens < 0 or self.output_tokens < 0:\n            raise ValueError("usage token counts must be non-negative")\n        if self.total_cost_usd is not None and self.total_cost_usd < 0:\n            raise ValueError("usage total_cost_usd must be non-negative")\n''',
              '''class Usage:\n    """Normalized token and cost metadata with optional provider-returned detail."""\n\n    input_tokens: int = 0\n    output_tokens: int = 0\n    total_tokens: int | None = None\n    cache_read_input_tokens: int | None = None\n    cache_write_input_tokens: int | None = None\n    total_cost_usd: Decimal | None = None\n\n    def __post_init__(self) -> None:\n        """Reject impossible usage values rather than silently normalizing them."""\n        if self.input_tokens < 0 or self.output_tokens < 0:\n            raise ValueError("usage token counts must be non-negative")\n        if self.total_tokens is not None:\n            if self.total_tokens < 0:\n                raise ValueError("usage total_tokens must be non-negative")\n            if self.total_tokens != self.input_tokens + self.output_tokens:\n                raise ValueError("usage total_tokens must equal input_tokens plus output_tokens")\n        for name, value in (\n            ("cache_read_input_tokens", self.cache_read_input_tokens),\n            ("cache_write_input_tokens", self.cache_write_input_tokens),\n        ):\n            if value is not None and value < 0:\n                raise ValueError(f"usage {name} must be non-negative")\n        if self.total_cost_usd is not None and self.total_cost_usd < 0:\n            raise ValueError("usage total_cost_usd must be non-negative")\n''',
          )
          replace(
              contracts,
              '''class ProviderExecution:\n    """Normalized execution metadata without provider-specific response objects."""\n\n    provider: str\n    model: str\n    deployment: str\n    status: ExecutionStatus\n    latency_ms: int\n    usage: Usage | None = None\n\n    def __post_init__(self) -> None:\n        """Validate concrete provider identity and measured execution metadata."""\n        if any(not value.strip() for value in (self.provider, self.model, self.deployment)):\n            raise ValueError("provider execution identity must be non-empty")\n        if self.latency_ms < 0:\n            raise ValueError("provider execution latency_ms must be non-negative")\n''',
              '''class ProviderExecution:\n    """Normalized terminal execution evidence without provider-specific response objects."""\n\n    provider: str\n    model: str\n    deployment: str\n    status: ExecutionStatus\n    latency_ms: int\n    usage: Usage | None = None\n    provider_request_id: str | None = None\n    finish_reason: str | None = None\n    attempt_number: int = 1\n    fallback_index: int = 0\n\n    def __post_init__(self) -> None:\n        """Validate concrete provider identity and measured execution metadata."""\n        if any(not value.strip() for value in (self.provider, self.model, self.deployment)):\n            raise ValueError("provider execution identity must be non-empty")\n        if self.latency_ms < 0:\n            raise ValueError("provider execution latency_ms must be non-negative")\n        for name, value in (\n            ("provider_request_id", self.provider_request_id),\n            ("finish_reason", self.finish_reason),\n        ):\n            if value is not None and (not value.strip() or value.strip() != value):\n                raise ValueError(f"provider execution {name} must be normalized when present")\n        if self.attempt_number <= 0:\n            raise ValueError("provider execution attempt_number must be positive")\n        if self.fallback_index < 0:\n            raise ValueError("provider execution fallback_index must be non-negative")\n''',
          )

          provider = 'packages/gateway-core/src/governed_llm_gateway_core/application/provider.py'
          replace(
              provider,
              '''class ProviderUsage:\n    """Provider-normalized token usage for one inference call."""\n\n    input_tokens: int = 0\n    output_tokens: int = 0\n    total_cost_usd: Decimal | None = None\n\n    def __post_init__(self) -> None:\n        """Reject impossible token counts instead of normalizing bad provider data silently."""\n        if self.input_tokens < 0 or self.output_tokens < 0:\n            raise ValueError("provider token usage must be non-negative")\n        if self.total_cost_usd is not None and self.total_cost_usd < 0:\n            raise ValueError("provider total_cost_usd must be non-negative")\n''',
              '''class ProviderUsage:\n    """Provider-normalized token usage preserving optional provider-returned detail."""\n\n    input_tokens: int = 0\n    output_tokens: int = 0\n    total_tokens: int | None = None\n    cache_read_input_tokens: int | None = None\n    cache_write_input_tokens: int | None = None\n    total_cost_usd: Decimal | None = None\n\n    def __post_init__(self) -> None:\n        """Reject impossible token counts instead of normalizing bad provider data silently."""\n        if self.input_tokens < 0 or self.output_tokens < 0:\n            raise ValueError("provider token usage must be non-negative")\n        if self.total_tokens is not None:\n            if self.total_tokens < 0:\n                raise ValueError("provider total_tokens must be non-negative")\n            if self.total_tokens != self.input_tokens + self.output_tokens:\n                raise ValueError("provider total_tokens must equal input_tokens plus output_tokens")\n        for name, value in (\n            ("cache_read_input_tokens", self.cache_read_input_tokens),\n            ("cache_write_input_tokens", self.cache_write_input_tokens),\n        ):\n            if value is not None and value < 0:\n                raise ValueError(f"provider {name} must be non-negative")\n        if self.total_cost_usd is not None and self.total_cost_usd < 0:\n            raise ValueError("provider total_cost_usd must be non-negative")\n''',
          )

          streaming = 'packages/gateway-core/src/governed_llm_gateway_core/application/streaming.py'
          replace(
              streaming,
              '''                provider_started = False\n                public_started = False\n''',
              '''                provider_started = False\n                provider_response_id: str | None = None\n                public_started = False\n''',
          )
          replace(
              streaming,
              '''                                    provider_started = True\n                                    continue\n''',
              '''                                    provider_started = True\n                                    provider_response_id = event.response_id\n                                    continue\n''',
          )
          replace(
              streaming,
              '''                                    final_usage = Usage(\n                                        input_tokens=event.usage.input_tokens,\n                                        output_tokens=event.usage.output_tokens,\n                                        total_cost_usd=event.usage.total_cost_usd,\n                                    )\n''',
              '''                                    final_usage = Usage(\n                                        input_tokens=event.usage.input_tokens,\n                                        output_tokens=event.usage.output_tokens,\n                                        total_tokens=event.usage.total_tokens,\n                                        cache_read_input_tokens=event.usage.cache_read_input_tokens,\n                                        cache_write_input_tokens=event.usage.cache_write_input_tokens,\n                                        total_cost_usd=event.usage.total_cost_usd,\n                                    )\n''',
          )
          replace(
              streaming,
              '''                                    execution = ProviderExecution(\n                                        provider=deployment.provider,\n                                        model=deployment.model_id,\n                                        deployment=deployment_id,\n                                        status=ExecutionStatus.SUCCEEDED,\n                                        latency_ms=latency_ms,\n                                        usage=final_usage,\n                                    )\n''',
              '''                                    if (\n                                        provider_response_id is not None\n                                        and event.response_id is not None\n                                        and provider_response_id != event.response_id\n                                    ):\n                                        raise _invalid_stream_event(\n                                            deployment.provider,\n                                            "provider response id changed during the stream",\n                                        )\n                                    execution = ProviderExecution(\n                                        provider=deployment.provider,\n                                        model=deployment.model_id,\n                                        deployment=deployment_id,\n                                        status=ExecutionStatus.SUCCEEDED,\n                                        latency_ms=latency_ms,\n                                        usage=final_usage,\n                                        provider_request_id=event.response_id or provider_response_id,\n                                        finish_reason=event.finish_reason,\n                                        attempt_number=attempt_number,\n                                        fallback_index=len(fallback_sequence) - 1,\n                                    )\n''',
          )
          replace(
              streaming,
              '''                        last_execution = ProviderExecution(\n                            provider=deployment.provider,\n                            model=deployment.model_id,\n                            deployment=deployment_id,\n                            status=ExecutionStatus.FAILED,\n                            latency_ms=latency_ms,\n                            usage=final_usage,\n                        )\n''',
              '''                        last_execution = ProviderExecution(\n                            provider=deployment.provider,\n                            model=deployment.model_id,\n                            deployment=deployment_id,\n                            status=ExecutionStatus.FAILED,\n                            latency_ms=latency_ms,\n                            usage=final_usage,\n                            provider_request_id=provider_response_id,\n                            attempt_number=attempt_number,\n                            fallback_index=len(fallback_sequence) - 1,\n                        )\n''',
          )

          api = 'apps/gateway-api/src/governed_llm_gateway_api/stream_generate.py'
          replace(
              api,
              '''        if event.usage.total_cost_usd is not None:\n            usage["total_cost_usd"] = _canonical_decimal(event.usage.total_cost_usd)\n''',
              '''        if event.usage.total_tokens is not None:\n            usage["total_tokens"] = event.usage.total_tokens\n        if event.usage.cache_read_input_tokens is not None:\n            usage["cache_read_input_tokens"] = event.usage.cache_read_input_tokens\n        if event.usage.cache_write_input_tokens is not None:\n            usage["cache_write_input_tokens"] = event.usage.cache_write_input_tokens\n        if event.usage.total_cost_usd is not None:\n            usage["total_cost_usd"] = _canonical_decimal(event.usage.total_cost_usd)\n''',
          )
          replace(
              api,
              '''        if event.execution.usage is not None:\n            execution_usage: dict[str, object] = {\n                "input_tokens": event.execution.usage.input_tokens,\n                "output_tokens": event.execution.usage.output_tokens,\n            }\n''',
              '''        execution["attempt_number"] = event.execution.attempt_number\n        execution["fallback_index"] = event.execution.fallback_index\n        if event.execution.provider_request_id is not None:\n            execution["provider_request_id"] = event.execution.provider_request_id\n        if event.execution.finish_reason is not None:\n            execution["finish_reason"] = event.execution.finish_reason\n        if event.execution.usage is not None:\n            execution_usage: dict[str, object] = {\n                "input_tokens": event.execution.usage.input_tokens,\n                "output_tokens": event.execution.usage.output_tokens,\n            }\n            if event.execution.usage.total_tokens is not None:\n                execution_usage["total_tokens"] = event.execution.usage.total_tokens\n            if event.execution.usage.cache_read_input_tokens is not None:\n                execution_usage["cache_read_input_tokens"] = (\n                    event.execution.usage.cache_read_input_tokens\n                )\n            if event.execution.usage.cache_write_input_tokens is not None:\n                execution_usage["cache_write_input_tokens"] = (\n                    event.execution.usage.cache_write_input_tokens\n                )\n''',
          )

          codec = 'packages/gateway-client/src/governed_llm_gateway_client/_codec.py'
          replace(
              codec,
              '''_USAGE_FIELDS = frozenset({"input_tokens", "output_tokens", "total_cost_usd"})\n_EXECUTION_FIELDS = frozenset({"provider", "model", "deployment", "status", "latency_ms", "usage"})\n''',
              '''_USAGE_FIELDS = frozenset(\n    {\n        "input_tokens",\n        "output_tokens",\n        "total_tokens",\n        "cache_read_input_tokens",\n        "cache_write_input_tokens",\n        "total_cost_usd",\n    }\n)\n_EXECUTION_FIELDS = frozenset(\n    {\n        "provider",\n        "model",\n        "deployment",\n        "status",\n        "latency_ms",\n        "usage",\n        "provider_request_id",\n        "finish_reason",\n        "attempt_number",\n        "fallback_index",\n    }\n)\n''',
          )
          replace(
              codec,
              '''    return Usage(\n        input_tokens=_required_int(payload, "input_tokens"),\n        output_tokens=_required_int(payload, "output_tokens"),\n        total_cost_usd=cost,\n    )\n''',
              '''    return Usage(\n        input_tokens=_required_int(payload, "input_tokens"),\n        output_tokens=_required_int(payload, "output_tokens"),\n        total_tokens=_optional_int(payload, "total_tokens"),\n        cache_read_input_tokens=_optional_int(payload, "cache_read_input_tokens"),\n        cache_write_input_tokens=_optional_int(payload, "cache_write_input_tokens"),\n        total_cost_usd=cost,\n    )\n''',
          )
          replace(
              codec,
              '''        latency_ms=_required_int(payload, "latency_ms"),\n        usage=_decode_usage(_as_object(usage_value, "execution usage"))\n        if usage_value is not None\n        else None,\n    )\n''',
              '''        latency_ms=_required_int(payload, "latency_ms"),\n        usage=_decode_usage(_as_object(usage_value, "execution usage"))\n        if usage_value is not None\n        else None,\n        provider_request_id=_optional_str(payload, "provider_request_id"),\n        finish_reason=_optional_str(payload, "finish_reason"),\n        attempt_number=_optional_int(payload, "attempt_number") or 1,\n        fallback_index=_optional_int(payload, "fallback_index") or 0,\n    )\n''',
          )
          replace(
              codec,
              '''def _required_int(payload: dict[str, object], key: str) -> int:\n    value = payload.get(key)\n    if not isinstance(value, int) or isinstance(value, bool):\n        raise GatewayProtocolError(f"{key} must be an integer")\n    return value\n\n\ndef _optional_bool(payload: dict[str, object], key: str, *, default: bool) -> bool:\n''',
              '''def _required_int(payload: dict[str, object], key: str) -> int:\n    value = payload.get(key)\n    if not isinstance(value, int) or isinstance(value, bool):\n        raise GatewayProtocolError(f"{key} must be an integer")\n    return value\n\n\ndef _optional_int(payload: dict[str, object], key: str) -> int | None:\n    value = payload.get(key)\n    if value is None:\n        return None\n    if not isinstance(value, int) or isinstance(value, bool):\n        raise GatewayProtocolError(f"{key} must be an integer when present")\n    return value\n\n\ndef _optional_bool(payload: dict[str, object], key: str, *, default: bool) -> bool:\n''',
          )

          Path('tests/contract/test_phase14_execution_provenance.py').write_text('''"""Phase 14 terminal execution provenance expansion regressions."""\n\nfrom decimal import Decimal\n\nimport pytest\nfrom governed_llm_gateway_contracts import ExecutionStatus, ProviderExecution, Usage\n\n\ndef test_usage_preserves_optional_provider_returned_detail() -> None:\n    usage = Usage(\n        input_tokens=10,\n        output_tokens=4,\n        total_tokens=14,\n        cache_read_input_tokens=3,\n        cache_write_input_tokens=2,\n        total_cost_usd=Decimal("0.0012"),\n    )\n    assert usage.total_tokens == 14\n    assert usage.cache_read_input_tokens == 3\n    assert usage.cache_write_input_tokens == 2\n    assert usage.total_cost_usd == Decimal("0.0012")\n\n\ndef test_usage_does_not_fabricate_optional_provider_detail() -> None:\n    usage = Usage(input_tokens=10, output_tokens=4)\n    assert usage.total_tokens is None\n    assert usage.cache_read_input_tokens is None\n    assert usage.cache_write_input_tokens is None\n    assert usage.total_cost_usd is None\n\n\ndef test_usage_rejects_contradictory_provider_total() -> None:\n    with pytest.raises(ValueError, match="total_tokens"):\n        Usage(input_tokens=10, output_tokens=4, total_tokens=15)\n\n\ndef test_execution_preserves_request_finish_attempt_and_fallback_provenance() -> None:\n    execution = ProviderExecution(\n        provider="anthropic",\n        model="claude",\n        deployment="claude-primary",\n        status=ExecutionStatus.SUCCEEDED,\n        latency_ms=42,\n        provider_request_id="req_provider_123",\n        finish_reason="end_turn",\n        attempt_number=2,\n        fallback_index=1,\n    )\n    assert execution.provider_request_id == "req_provider_123"\n    assert execution.finish_reason == "end_turn"\n    assert execution.attempt_number == 2\n    assert execution.fallback_index == 1\n\n\ndef test_execution_rejects_invalid_attempt_provenance() -> None:\n    with pytest.raises(ValueError, match="attempt_number"):\n        ProviderExecution(\n            provider="anthropic",\n            model="claude",\n            deployment="d",\n            status=ExecutionStatus.SUCCEEDED,\n            latency_ms=1,\n            attempt_number=0,\n        )\n''')
          PY
          uvx --from ruff==0.12.11 ruff format \
            packages/gateway-contracts/src/governed_llm_gateway_contracts/contracts.py \
            packages/gateway-core/src/governed_llm_gateway_core/application/provider.py \
            packages/gateway-core/src/governed_llm_gateway_core/application/streaming.py \
            apps/gateway-api/src/governed_llm_gateway_api/stream_generate.py \
            packages/gateway-client/src/governed_llm_gateway_client/_codec.py \
            tests/contract/test_phase14_execution_provenance.py
      - name: Commit code expansion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages apps tests
          git commit -m "feat: preserve provider-neutral execution provenance"
          git push
