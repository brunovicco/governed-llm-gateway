name: phase14-terminal-evidence-test-migration

on:
  push:
    branches: [fix/sdk-terminal-execution-evidence]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/sdk-terminal-execution-evidence
      - name: Apply compatibility and existing-test migration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1))

          contracts = "packages/gateway-contracts/src/governed_llm_gateway_contracts/contracts.py"
          replace(
              contracts,
              "            self._validate_execution(ExecutionStatus.SUCCEEDED, required=True)\n",
              "            self._validate_execution(ExecutionStatus.SUCCEEDED, required=False)\n",
          )

          streaming = "packages/gateway-core/src/governed_llm_gateway_core/application/streaming.py"
          replace(
              streaming,
              "    Capability,\n    GatewayError,\n    ExecutionStatus,\n",
              "    Capability,\n    ExecutionStatus,\n    GatewayError,\n",
          )

          tests = "tests/contract/test_phase12_client_sdk.py"
          replace(
              tests,
              "import unittest\nfrom collections.abc import Mapping\n",
              "import unittest\nfrom collections.abc import Mapping\nfrom decimal import Decimal\n",
          )
          replace(
              tests,
              "    PolicyProvenance,\n    RiskLevel,\n",
              "    PolicyProvenance,\n    ProviderExecution,\n    RiskLevel,\n",
          )
          replace(
              tests,
              "    RoutingProvenance,\n    StreamEventType,\n",
              "    RoutingProvenance,\n    StreamEventType,\n    Usage,\n",
          )
          replace(
              tests,
              "            _sse(\n                StreamEventType.RESPONSE_COMPLETED,\n                5,\n                routing=routing,\n                finish_reason=\"stop\",\n            ),\n",
              "            _sse(\n                StreamEventType.RESPONSE_COMPLETED,\n                5,\n                routing=routing,\n                execution={\n                    \"provider\": \"provider-a\",\n                    \"model\": \"model/a\",\n                    \"deployment\": \"candidate-a\",\n                    \"status\": \"succeeded\",\n                    \"latency_ms\": 37,\n                    \"usage\": {\n                        \"input_tokens\": 10,\n                        \"output_tokens\": 2,\n                        \"total_cost_usd\": \"0.01\",\n                    },\n                },\n                finish_reason=\"stop\",\n            ),\n",
          )
          replace(
              tests,
              "        self.assertIsNone(response.execution)\n        self.assertEqual(response.routing.benchmark_snapshot_id",
              "        self.assertEqual(\n            response.execution,\n            ProviderExecution(\n                provider=\"provider-a\",\n                model=\"model/a\",\n                deployment=\"candidate-a\",\n                status=ExecutionStatus.SUCCEEDED,\n                latency_ms=37,\n                usage=Usage(\n                    input_tokens=10,\n                    output_tokens=2,\n                    total_cost_usd=Decimal(\"0.01\"),\n                ),\n            ),\n        )\n        self.assertEqual(response.routing.benchmark_snapshot_id",
          )
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/phase14-terminal-evidence-test-migration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/gateway-contracts packages/gateway-core tests/contract/test_phase12_client_sdk.py .github/workflows/phase14-terminal-evidence-test-migration.yml
          git commit -m "test: migrate SDK terminal evidence expectations"
          git push origin HEAD:fix/sdk-terminal-execution-evidence
