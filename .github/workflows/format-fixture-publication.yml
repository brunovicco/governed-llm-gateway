name: format-fixture-publication

on:
  push:
    branches:
      - feat/multimodal-fixture-publication-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Apply authoritative Ruff formatting
        run: uvx --python 3.13 --from ruff==0.12.11 ruff format benchmarks/fixture_publication.py
      - name: Commit formatting when needed
        run: |
          if git diff --quiet -- benchmarks/fixture_publication.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/fixture_publication.py
          git commit -m "style: format fixture publication module"
          git push
