name: apply-tool-argument-generation

on:
  push:
    branches:
      - feat/tool-argument-generation-benchmark-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tool-argument-generation-benchmark-v1
      - name: Apply deterministic registrations
        run: |
          python - <<'PY'
          from pathlib import Path

          contracts = Path("benchmarks/contracts.py")
          text = contracts.read_text()
          old = '    TOOL_SELECTION = "tool_selection"\n    TOOL_USE = "tool_use"\n'
          new = '    TOOL_SELECTION = "tool_selection"\n    TOOL_ARGUMENT_GENERATION = "tool_argument_generation"\n    TOOL_USE = "tool_use"\n'
          if '    TOOL_ARGUMENT_GENERATION = "tool_argument_generation"\n' not in text:
              assert text.count(old) == 1
              contracts.write_text(text.replace(old, new, 1))

          scoring = Path("benchmarks/scoring.py")
          text = scoring.read_text()
          import_anchor = 'from .workloads.tool_selection import (\n'
          import_block = (
              'from .workloads.tool_argument_generation import (\n'
              '    TOOL_ARGUMENT_GENERATION_SCORER_ID,\n'
              '    score_tool_argument_generation,\n'
              ')\n'
          )
          if 'TOOL_ARGUMENT_GENERATION_SCORER_ID' not in text:
              assert text.count(import_anchor) == 1
              text = text.replace(import_anchor, import_block + import_anchor, 1)
              registry_anchor = '        TOOL_SELECTION_SCORER_ID: score_tool_selection,\n'
              assert text.count(registry_anchor) == 1
              text = text.replace(
                  registry_anchor,
                  '        TOOL_ARGUMENT_GENERATION_SCORER_ID: score_tool_argument_generation,\n'
                  + registry_anchor,
                  1,
              )
              scoring.write_text(text)
          PY
      - name: Commit registrations when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/contracts.py benchmarks/scoring.py
          git commit -m "feat: register tool argument generation benchmark"
          git push origin HEAD:feat/tool-argument-generation-benchmark-v1
