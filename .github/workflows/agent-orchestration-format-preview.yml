name: agent-orchestration-format-preview

on:
  push:
    branches:
      - feat/benchmark-agent-orchestration-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Apply pinned Ruff format
        run: uvx --python 3.13 --from ruff==0.12.11 ruff format benchmarks/workloads/agent_orchestration.py tests/contract/test_agent_orchestration_benchmark.py
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/workloads/agent_orchestration.py tests/contract/test_agent_orchestration_benchmark.py
          git commit -m "style: format agent orchestration benchmark"
          git push origin HEAD:feat/benchmark-agent-orchestration-v1
