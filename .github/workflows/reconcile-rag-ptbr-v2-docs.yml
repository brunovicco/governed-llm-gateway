name: reconcile-rag-ptbr-v2-docs

on:
  push:
    branches:
      - docs/reconcile-rag-ptbr-v2-pr67
    paths:
      - .github/workflows/reconcile-rag-ptbr-v2-docs.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-rag-ptbr-v2-pr67
      - name: Reconcile post-PR 67 documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one marker in {path}, found {count}: {old!r}")
              target.write_text(text.replace(old, new))

          # README.md
          replace_once(
              "README.md",
              "Status: **Phases 0–13 complete; Phase 14 in progress — Cases 1/2 complete, Case 3 deferred. All roadmap-listed benchmark classes are represented by reviewed deterministic contracts. Reviewed quality-component evidence is preserved separately from operational health; independent PT-BR language quality remains an explicit measurement gap.**",
              "Status: **Phases 0–13 complete; Phase 14 in progress — Cases 1/2 complete, Case 3 deferred. All roadmap-listed benchmark classes are represented by reviewed deterministic contracts. Reviewed quality-component evidence is preserved separately from operational health, including bounded PT-BR locale/terminology quality in `rag-ptbr-v2`; no universal fluency or grammar claim is made.**",
          )
          replace_once(
              "README.md",
              "| `rag_ptbr` | `rag-ptbr-v1` | PR #20 |",
              "| `rag_ptbr` | `rag-ptbr-v2` (v1 preserved historically) | PRs #20 and #67 |",
          )
          replace_once(
              "README.md",
              "- `grounding`.\n",
              "- `grounding`;\n- `pt_br_quality` (bounded reviewed Brazilian Portuguese locale/terminology conformance).\n",
          )
          replace_once(
              "README.md",
              "Independent PT-BR language quality is intentionally **not** claimed yet. `rag-ptbr-v1` measures reviewed required-fact coverage with forbidden-claim checks in PT-BR, not separate Portuguese fluency, grammar, terminology, localization or style quality.",
              "PR #67 adds `rag-ptbr-v2`, which preserves `grounding` separately from a bounded `pt_br_quality` component based only on reviewer-authored Brazilian Portuguese locale/terminology rules. Historical `rag-ptbr-v1` remains unchanged and component-free for language quality. This does not claim arbitrary Portuguese fluency, complete grammar correctness, unrestricted semantic equivalence, style/tone or cultural appropriateness.",
          )
          replace_once(
              "README.md",
              "Current validated `main` baseline after PR #64 (`ef1d83c8c82a63a3f5abc533d7dc75db51144690`):\n\n- **714 tests passed**;\n- **82.21% aggregate coverage** (threshold 80%);\n- mypy passed across **172 source files**;\n- Ruff lint/format passed across **172 files**;\n- Bandit reported **0 issues** across 15,972 LOC;\n- pip-audit reported **no known vulnerabilities**;\n- architecture check, secret scan and Phase 0 gate passed;\n- post-merge `main` quality run `34048733993` — **PASS**.",
              "Current validated `main` baseline after PR #67 (`a92e7961ae2de6d3ec40aaa0dda3a955b4e92660`):\n\n- **725 tests passed**;\n- **82.16% aggregate coverage** (threshold 80%);\n- mypy passed across **174 source files**;\n- Ruff lint/format passed across **174 files**;\n- Bandit reported **0 issues** across 16,170 LOC;\n- pip-audit reported **no known vulnerabilities**;\n- architecture check, secret scan and Phase 0 gate passed;\n- post-merge `main` quality run `34050920267` — **PASS**.",
          )
          replace_once(
              "README.md",
              "- `docs/evaluation/BENCHMARK_QUALITY_COMPONENTS.md` — reviewed component metrics, snapshot schema 1.2 and the explicit PT-BR-quality gap;",
              "- `docs/evaluation/BENCHMARK_QUALITY_COMPONENTS.md` — reviewed component metrics, snapshot schema 1.2 and bounded `pt_br_quality` evidence;",
          )

          # README.pt-BR.md
          replace_once(
              "README.pt-BR.md",
              "Status: **Phases 0–13 concluídas; Phase 14 em andamento — Cases 1/2 concluídos, Case 3 deferido. Todas as classes de benchmark listadas no roadmap estão representadas por contratos determinísticos revisados. Evidência revisada de componentes de qualidade é preservada separadamente da saúde operacional; qualidade linguística PT-BR independente permanece um gap explícito de medição.**",
              "Status: **Phases 0–13 concluídas; Phase 14 em andamento — Cases 1/2 concluídos, Case 3 deferido. Todas as classes de benchmark listadas no roadmap estão representadas por contratos determinísticos revisados. Evidência revisada de componentes de qualidade é preservada separadamente da saúde operacional, incluindo qualidade limitada de localidade/terminologia PT-BR em `rag-ptbr-v2`; não há alegação de fluência ou gramática universal.**",
          )
          replace_once(
              "README.pt-BR.md",
              "| `rag_ptbr` | `rag-ptbr-v1` | PR #20 |",
              "| `rag_ptbr` | `rag-ptbr-v2` (v1 preservado historicamente) | PRs #20 e #67 |",
          )
          replace_once(
              "README.pt-BR.md",
              "- `grounding`.\n",
              "- `grounding`;\n- `pt_br_quality` (conformidade limitada e revisada de localidade/terminologia do português do Brasil).\n",
          )
          replace_once(
              "README.pt-BR.md",
              "Qualidade linguística PT-BR independente intencionalmente **ainda não é reivindicada**. `rag-ptbr-v1` mede cobertura revisada de fatos obrigatórios com checks de `forbidden_claim` em PT-BR, não fluência, gramática, terminologia, localização ou estilo em português de forma separada.",
              "O PR #67 adiciona `rag-ptbr-v2`, que preserva `grounding` separadamente de um componente limitado `pt_br_quality`, baseado apenas em regras revisadas de localidade/terminologia do português do Brasil. O histórico `rag-ptbr-v1` permanece inalterado e sem componente de qualidade linguística. Isso não reivindica fluência arbitrária, correção gramatical completa, equivalência semântica irrestrita, estilo/tom ou adequação cultural.",
          )
          replace_once(
              "README.pt-BR.md",
              "Baseline validado atual do `main` após o PR #64 (`ef1d83c8c82a63a3f5abc533d7dc75db51144690`):\n\n- **714 testes passaram**;\n- **82,21% de cobertura agregada** (threshold 80%);\n- mypy passou em **172 arquivos fonte**;\n- Ruff lint/format passou em **172 arquivos**;\n- Bandit reportou **0 issues** em 15.972 LOC;\n- pip-audit reportou **nenhuma vulnerabilidade conhecida**;\n- architecture check, secret scan e Phase 0 gate passaram;\n- quality run pós-merge no `main` `34048733993` — **PASS**.",
              "Baseline validado atual do `main` após o PR #67 (`a92e7961ae2de6d3ec40aaa0dda3a955b4e92660`):\n\n- **725 testes passaram**;\n- **82,16% de cobertura agregada** (threshold 80%);\n- mypy passou em **174 arquivos fonte**;\n- Ruff lint/format passou em **174 arquivos**;\n- Bandit reportou **0 issues** em 16.170 LOC;\n- pip-audit reportou **nenhuma vulnerabilidade conhecida**;\n- architecture check, secret scan e Phase 0 gate passaram;\n- quality run pós-merge no `main` `34050920267` — **PASS**.",
          )
          replace_once(
              "README.pt-BR.md",
              "- `docs/evaluation/BENCHMARK_QUALITY_COMPONENTS.md` — componentes revisados, snapshot schema 1.2 e gap explícito de qualidade PT-BR;",
              "- `docs/evaluation/BENCHMARK_QUALITY_COMPONENTS.md` — componentes revisados, snapshot schema 1.2 e evidência limitada de `pt_br_quality`;",
          )

          # benchmarks/results/README.md
          replace_once(
              "benchmarks/results/README.md",
              "- `grounding`.\n\nIndependent PT-BR language quality is not inferred from `rag-ptbr-v1`; it remains a separate explicit\nmeasurement gap.",
              "- `grounding`;\n- `pt_br_quality`.\n\n`pt_br_quality` is emitted only by the reviewed `rag-ptbr-v2` contract and means bounded Brazilian\nPortuguese locale/terminology conformance for case-local reviewer-authored rules. Historical\n`rag-ptbr-v1` remains component-free for language quality, and no snapshot should reinterpret v1 as\nfluency, grammar, style or unrestricted localization evidence.",
          )

          # BENCHMARK_QUALITY_COMPONENTS.md
          replace_once(
              "docs/evaluation/BENCHMARK_QUALITY_COMPONENTS.md",
              "| `grounding` | `rag-answer-v1` |",
              "| `grounding` | `rag-answer-v1`, `rag-ptbr-v2` |\n| `pt_br_quality` | `rag-ptbr-v2` |",
          )
          replace_once(
              "docs/evaluation/BENCHMARK_QUALITY_COMPONENTS.md",
              "| PT-BR quality | **GAP — not claimed by the current scorer contract** |",
              "| PT-BR quality | bounded reviewer-authored locale/terminology conformance preserved as `pt_br_quality` by `rag-ptbr-v2`; not a universal fluency/grammar claim |",
          )
          replace_once(
              "docs/evaluation/BENCHMARK_QUALITY_COMPONENTS.md",
              "### PT-BR quality remains an explicit gap\n\n`rag-ptbr-v1` evaluates deterministic required-fact coverage and rejects reviewed forbidden\nclaims in a PT-BR case. That is useful grounded-answer evidence, but it is not an independent\nmeasurement of Portuguese fluency, grammar, style, terminology, localization quality or\nother language-quality dimensions.\n\nThe framework therefore does not alias `rag-ptbr-v1` to a fabricated `pt_br_quality`\nmetric. A future PT-BR quality measure requires its own reviewed deterministic contract or\nanother explicitly governed evaluation method.",
              "### PT-BR quality is bounded and explicit\n\n`rag-ptbr-v1` remains the historical required-fact/forbidden-claim contract and still exposes no\nlanguage-quality component. PR #67 adds `rag-ptbr-v2`, which keeps `grounding` separate from\n`pt_br_quality`. The new component measures only conformance to case-local reviewer-authored\nBrazilian Portuguese locale/terminology rules using explicit preferred and rejected terms.\n\nThis closes the Roadmap measurement gap only at that bounded level. It does not claim arbitrary\nPortuguese fluency, complete grammar correctness, unrestricted semantic equivalence, style/tone,\ncultural appropriateness or quality across every Portuguese variety. Those would require separate\nreviewed contracts.",
          )

          # BENCHMARK_MATRIX.md
          replace_once(
              "docs/evaluation/BENCHMARK_MATRIX.md",
              "PR #61 added the distinct `json_schema_compliance` class.",
              "PR #61 added the distinct `json_schema_compliance` class, and PR #67 added bounded `pt_br_quality` evidence through `rag-ptbr-v2` while preserving v1 historically.",
          )
          replace_once(
              "docs/evaluation/BENCHMARK_MATRIX.md",
              "| `rag_ptbr` | `rag-ptbr-v1` | reviewed required-fact coverage with explicit forbidden-claim regression checks | #20 |",
              "| `rag_ptbr` | `rag-ptbr-v2` | required-fact grounding plus bounded reviewer-authored Brazilian Portuguese locale/terminology conformance; v1 preserved historically | #20 established v1; #67 added v2 |",
          )
          replace_once(
              "docs/evaluation/BENCHMARK_MATRIX.md",
              "### rag_ptbr\n\nThe v1 scorer checks reviewed required facts inside a synthetic/public PT-BR context and forces a zero score when a reviewed conflicting/unsupported `forbidden_claim` appears.\n\nIt intentionally does not claim arbitrary factuality evaluation and does not call another model as judge.",
              "### rag_ptbr\n\n`rag-ptbr-v1` remains the historical scorer for reviewed required-fact coverage with explicit forbidden-claim regression. PR #67 adds `rag-ptbr-v2` without rewriting v1: each v2 completed call exposes separate `grounding` and `pt_br_quality` components.\n\n`pt_br_quality` is intentionally narrow: it scores only reviewer-authored case-local Brazilian Portuguese locale/terminology rules using explicit preferred and rejected terms. Unsupported reviewed claims still fail overall RAG quality closed. The benchmark does not use another model as judge and does not claim arbitrary fluency, complete grammar correctness, style/tone, cultural appropriateness or every Portuguese variety.",
          )
          replace_once(
              "docs/evaluation/BENCHMARK_MATRIX.md",
              "PR #64 preserved reviewed offline quality components in observations, scorecards and snapshot schema 1.2 without changing promotion or ranking.",
              "PR #64 preserved reviewed offline quality components in observations, scorecards and snapshot schema 1.2 without changing promotion or ranking. PR #67 then added bounded `pt_br_quality` plus independent `grounding` evidence for `rag-ptbr-v2`, preserving `rag-ptbr-v1` unchanged.",
          )
          replace_once(
              "docs/evaluation/BENCHMARK_MATRIX.md",
              "- `grounding`.\n\n`quality_success_rate` remains the reviewed task-success aggregate.",
              "- `grounding`;\n- `pt_br_quality` — bounded reviewer-authored Brazilian Portuguese locale/terminology conformance from `rag-ptbr-v2`.\n\n`quality_success_rate` remains the reviewed task-success aggregate.",
          )
          replace_once(
              "docs/evaluation/BENCHMARK_MATRIX.md",
              "PT-BR quality remains an explicit gap: `rag-ptbr-v1` measures required-fact coverage with forbidden-claim checks in PT-BR, not independent Portuguese fluency/grammar/localization/style quality. The ledger therefore does not fabricate a `pt_br_quality` alias.",
              "PR #67 closes the explicit PT-BR measurement gap only with bounded evidence: `rag-ptbr-v2` measures case-local Brazilian Portuguese locale/terminology conformance as `pt_br_quality` separately from grounding. The ledger still does not infer arbitrary Portuguese fluency, complete grammar correctness, unrestricted localization/style quality or dialect quality from that component.",
          )
          replace_once(
              "docs/evaluation/BENCHMARK_MATRIX.md",
              "Latest validated `main` baseline after PR #64:\n\n- commit `ef1d83c8c82a63a3f5abc533d7dc75db51144690`;\n- post-merge quality run `34048733993` — PASS;\n- 714 tests passed;\n- 82.21% aggregate coverage;\n- strict mypy and Ruff passed across 172 source files;\n- Bandit reported no issues across 15,972 LOC;",
              "Latest validated `main` baseline after PR #67:\n\n- commit `a92e7961ae2de6d3ec40aaa0dda3a955b4e92660`;\n- post-merge quality run `34050920267` — PASS;\n- 725 tests passed;\n- 82.16% aggregate coverage;\n- strict mypy and Ruff passed across 174 source files;\n- Bandit reported no issues across 16,170 LOC;",
          )
          replace_once(
              "docs/evaluation/BENCHMARK_MATRIX.md",
              "Until that changes, further gateway work should be consumer-agnostic and independently justified. The Roadmap measurement audit is now explicit: all currently supportable deterministic component measures are preserved, while independent PT-BR quality remains the next concrete benchmark-measurement gap. A future live benchmark executor must use normal gateway authorization and must not introduce a benchmark-only provider/model forcing path.",
              "Until that changes, further gateway work should be consumer-agnostic and independently justified. The Roadmap measurement audit now preserves every currently reviewed deterministic quality dimension, including bounded `pt_br_quality`; broader language-quality claims remain intentionally out of scope unless a separate explicit contract is justified. A future live benchmark executor must use normal gateway authorization and must not introduce a benchmark-only provider/model forcing path.",
          )

          # CURRENT_STATE.md
          replace_once(
              "docs/project/CURRENT_STATE.md",
              "- PR #64 — immutable benchmark quality-component evidence for schema validity, tool selection, tool arguments, trajectory success and grounding, with snapshot schema 1.2 and no implicit promotion/ranking change.",
              "- PR #64 — immutable benchmark quality-component evidence for schema validity, tool selection, tool arguments, trajectory success and grounding, with snapshot schema 1.2 and no implicit promotion/ranking change.\n- PR #67 — `rag-ptbr-v2`, preserving historical v1 while adding separate grounding and bounded reviewer-authored Brazilian Portuguese locale/terminology quality evidence as `pt_br_quality`, with no provider/model forcing or promotion/ranking change.",
          )
          replace_once(
              "docs/project/CURRENT_STATE.md",
              "All roadmap-listed benchmark classes now have reviewed versioned contracts. The Roadmap measurement audit also preserves every currently supportable deterministic quality component separately from operational health. Independent PT-BR language quality remains an explicit gap rather than being fabricated from `rag-ptbr-v1` grounding evidence.",
              "All roadmap-listed benchmark classes now have reviewed versioned contracts. The Roadmap measurement audit preserves every currently reviewed deterministic quality component separately from operational health, including bounded `pt_br_quality` from `rag-ptbr-v2`. Historical `rag-ptbr-v1` remains unchanged, and broader fluency/grammar/style/cultural-quality claims remain explicitly out of scope.",
          )
          replace_once(
              "docs/project/CURRENT_STATE.md",
              "Latest validated gateway baseline after PR #64:\n\n`ef1d83c8c82a63a3f5abc533d7dc75db51144690`\n\nPost-merge quality run:\n\n`34048733993` — PASS.\n\nValidation:\n\n- 714 tests passed;\n- aggregate coverage 82.21%;\n- strict mypy passed across 172 source files;\n- Ruff lint/format passed across 172 files;\n- Bandit reported no issues across 15,972 LOC;",
              "Latest validated gateway baseline after PR #67:\n\n`a92e7961ae2de6d3ec40aaa0dda3a955b4e92660`\n\nPost-merge quality run:\n\n`34050920267` — PASS.\n\nValidation:\n\n- 725 tests passed;\n- aggregate coverage 82.16%;\n- strict mypy passed across 174 source files;\n- Ruff lint/format passed across 174 files;\n- Bandit reported no issues across 16,170 LOC;",
          )
          replace_once(
              "docs/project/CURRENT_STATE.md",
              "6. Preserve PT-BR quality as the next explicit benchmark-measurement gap; do not alias `rag-ptbr-v1` grounded fact coverage to independent language quality.\n7. Keep quality-component evidence outside promotion/ranking until a separate explicit versioned contract reviews such use.\n8. A future live gateway-backed benchmark executor must use an already-authorized gateway path, preserve target/effective-execution integrity checks, and remain outside credential-free default CI.\n9. When OpsLens is resumed, reconcile against the then-current gateway commit and rerun the full OpsLens Python and Terraform gates before merge.",
              "6. Treat `rag-ptbr-v2` `pt_br_quality` strictly as bounded reviewer-authored Brazilian Portuguese locale/terminology evidence; do not generalize it into arbitrary fluency, grammar, style or cultural-quality claims.\n7. Keep quality-component evidence outside promotion/ranking until a separate explicit versioned contract reviews such use.\n8. A future live gateway-backed benchmark executor must use an already-authorized gateway path, preserve target/effective-execution integrity checks, and remain outside credential-free default CI.\n9. When OpsLens is resumed, reconcile against the then-current gateway commit and rerun the full OpsLens Python and Terraform gates before merge.",
          )

          # RAG_PTBR_V2.md
          replace_once(
              "docs/evaluation/RAG_PTBR_V2.md",
              "Status: **IN DEVELOPMENT — tracked by issue #66.**",
              "Status: **COMPLETE — merged in PR #67; issue #66 closed after validated post-merge CI.**",
          )
          PY
      - name: Commit documentation reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.pt-BR.md benchmarks/results/README.md docs/evaluation/BENCHMARK_MATRIX.md docs/evaluation/BENCHMARK_QUALITY_COMPONENTS.md docs/evaluation/RAG_PTBR_V2.md docs/project/CURRENT_STATE.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: reconcile rag ptbr v2 through PR 67"
          git push origin HEAD:docs/reconcile-rag-ptbr-v2-pr67
