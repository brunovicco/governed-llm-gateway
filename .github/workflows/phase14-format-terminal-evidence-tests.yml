name: phase14-format-terminal-evidence-tests

on:
  push:
    branches: [fix/sdk-terminal-execution-evidence]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/sdk-terminal-execution-evidence
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
      - name: Format new evidence tests with repository-pinned Ruff
        run: |
          uvx --python 3.13 --from ruff==0.12.11 ruff format \
            tests/contract/test_phase14_terminal_execution_evidence.py \
            tests/contract/test_phase14_terminal_execution_required.py
          uvx --python 3.13 --from ruff==0.12.11 ruff format --check \
            tests/contract/test_phase14_terminal_execution_evidence.py \
            tests/contract/test_phase14_terminal_execution_required.py
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/phase14-format-terminal-evidence-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/contract/test_phase14_terminal_execution_evidence.py tests/contract/test_phase14_terminal_execution_required.py .github/workflows/phase14-format-terminal-evidence-tests.yml
          git commit -m "style: format terminal execution evidence tests"
          git push origin HEAD:fix/sdk-terminal-execution-evidence
