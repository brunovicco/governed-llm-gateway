name: temp-code-review-format

on:
  push:
    branches:
      - feat/code-review-benchmark-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Format exact test file
        run: uvx --python 3.13 --from ruff==0.12.11 ruff format tests/contract/test_code_review_benchmark.py
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/contract/test_code_review_benchmark.py
          git commit -m "style: format code review benchmark test" || exit 0
          git push
