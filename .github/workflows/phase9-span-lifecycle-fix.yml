name: phase9-span-lifecycle-fix

on:
  push:
    branches:
      - feat/phase-9-opentelemetry

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-9-opentelemetry
      - uses: astral-sh/setup-uv@v6
      - name: End provider spans before retry backoff
        run: |
          python - <<'PY'
          from pathlib import Path

          resilience = Path('packages/gateway-core/src/governed_llm_gateway_core/application/resilience.py')
          lines = resilience.read_text().splitlines()
          started = '                started = self._clock()'
          with_span = '                with span_context as span:'
          i = lines.index(started)
          if lines[i + 1] != with_span:
              raise SystemExit('unexpected resilience span layout')
          lines.insert(i + 1, '                retry_delay_after_span: float | None = None')
          sleeper = '                            await self._sleeper(retry_delay)'
          i = lines.index(sleeper)
          expected = [
              '                        if can_retry and retry_delay is not None:',
              sleeper,
              '                            continue',
              '                        break',
          ]
          if lines[i - 1:i + 3] != expected:
              raise SystemExit('unexpected resilience retry layout')
          lines[i - 1:i + 3] = [
              '                        if can_retry and retry_delay is not None:',
              '                            retry_delay_after_span = retry_delay',
              '                        else:',
              '                            break',
          ]
          final_raise = '        raise ResilienceExecutionError('
          i = lines.index(final_raise)
          lines[i:i] = [
              '                if retry_delay_after_span is not None:',
              '                    await self._sleeper(retry_delay_after_span)',
              '                    continue',
              '',
          ]
          resilience.write_text('\n'.join(lines) + '\n')

          streaming = Path('packages/gateway-core/src/governed_llm_gateway_core/application/streaming.py')
          lines = streaming.read_text().splitlines()
          with_span = '                with span_context as span:'
          i = lines.index(with_span)
          lines.insert(i, '                retry_delay_after_span: float | None = None')
          sleeper = '                            await self._sleeper(delay)'
          i = lines.index(sleeper)
          if lines[i + 1] != '                            continue':
              raise SystemExit('unexpected streaming retry layout')
          lines[i:i + 2] = ['                            retry_delay_after_span = delay']
          transient = '                        if transient:'
          i = lines.index(transient, i)
          lines[i] = '                        elif transient:'
          failure_yield = '                        yield _failed_event('
          yield_i = lines.index(failure_yield, i)
          return_i = lines.index('                        return', yield_i)
          lines.insert(yield_i, '                        else:')
          yield_i += 1
          return_i += 1
          for j in range(yield_i, return_i + 1):
              lines[j] = '    ' + lines[j]
          final_retryable = (
              '        retryable = last_error.retryable if last_error is not None else False'
          )
          i = lines.index(final_retryable)
          lines[i:i] = [
              '                if retry_delay_after_span is not None:',
              '                    await self._sleeper(retry_delay_after_span)',
              '                    continue',
              '',
          ]
          streaming.write_text('\n'.join(lines) + '\n')
          PY
          uvx --python 3.13 --from ruff==0.12.11 ruff format packages/gateway-core/src/governed_llm_gateway_core/application/resilience.py packages/gateway-core/src/governed_llm_gateway_core/application/streaming.py
          uvx --python 3.13 --from ruff==0.12.11 ruff check packages/gateway-core/src/governed_llm_gateway_core/application/resilience.py packages/gateway-core/src/governed_llm_gateway_core/application/streaming.py
          rm .github/workflows/phase9-span-lifecycle-fix.yml
      - name: Commit lifecycle fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: end provider spans before retry backoff'
          git push origin HEAD:feat/phase-9-opentelemetry
