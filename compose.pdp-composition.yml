# Runs a real Policy Model Router with signed runtime authorization *enforced*, so the Gateway's
# PDP adapter can be exercised against it end to end.
#
# This is the only place the two services in the authority chain actually meet. Each repository
# keeps its own hand-written mirror of the Verifiable AI Governance runtime-authorization contract,
# because the canonical signing bytes must stay byte-identical across them and neither side may
# import the other. Nothing in either CI compares those mirrors. This stack does.
#
# The Router is built from a sibling checkout; point `POLICY_MODEL_ROUTER_PATH` at it if the
# default is wrong. The trusted key set is generated by `scripts/composition_fixture.py` before
# `up`, because it carries the public half of a key derived at run time rather than a committed
# secret.
#
# `APP_ENV=development` with `RUNTIME_AUTHORIZATION_REQUIRED=true` is deliberate. It is the
# enforcing configuration, minus the two things a `staging`/`production` Router additionally
# mandates: Governance Runtime Control, which needs a Governance projection that does not exist
# yet. Redis is still here, so replay protection runs in its real cross-replica shape rather than
# the in-process fallback.

name: pdp-composition-proof

services:
  replay-state:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  policy-model-router:
    build:
      context: ${POLICY_MODEL_ROUTER_PATH:-../policy-model-router}
      dockerfile: Dockerfile
    image: policy-model-router:composition-proof
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      APP_ENV: development
      LOG_FORMAT: console
      ROUTING_POLICY_PATH: /etc/policy-model-router/routing_policy.yaml
      REDIS_URL: redis://replay-state:6379/0
      API_KEYS: '{"composition-proof-client": "composition-proof-api-key"}'
      RUNTIME_AUTHORIZATION_REQUIRED: "true"
      RUNTIME_AUTHORIZATION_ISSUER: verifiable-ai-governance:composition-proof
      RUNTIME_AUTHORIZATION_AUDIENCE: policy-model-router
      RUNTIME_AUTHORIZATION_TRUSTED_KEY_SET_PATH: /etc/policy-model-router/runtime-authorization-keys.json
      RUNTIME_AUTHORIZATION_AGENT_BINDINGS_JSON: '{"composition-proof-client": "44444444-4444-4444-8444-444444444444"}'
      RUNTIME_AUTHORIZATION_EXPECTED_POLICY_ID: composition-proof-governance-policy
      RUNTIME_AUTHORIZATION_EXPECTED_POLICY_VERSION: "1.0.0"
      RUNTIME_AUTHORIZATION_EXPECTED_POLICY_DIGEST: "1111111111111111111111111111111111111111111111111111111111111111"
      RUNTIME_AUTHORIZATION_EXPECTED_CONTROL_CATALOG_ID: composition-proof-controls
      RUNTIME_AUTHORIZATION_EXPECTED_CONTROL_CATALOG_VERSION: "1.0.0"
      RUNTIME_AUTHORIZATION_EXPECTED_CONTROL_CATALOG_DIGEST: "2222222222222222222222222222222222222222222222222222222222222222"
    volumes:
      - ./config/composition-proof/routing_policy.yaml:/etc/policy-model-router/routing_policy.yaml:ro
      - ./.composition/runtime-authorization-keys.json:/etc/policy-model-router/runtime-authorization-keys.json:ro
    depends_on:
      replay-state:
        condition: service_healthy
